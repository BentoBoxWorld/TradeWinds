    # This is the COMPLETE table. BentoBox REPLACES map settings from config
    # rather than merging them, so an entry deleted here is a good that can no
    # longer be sold at all - not a fallback to the built-in price.
border:
  # Show island boundaries as particle curtains: the warp-offer ring at the
  # protection edge (red - where the warp dialog fires) and the edge of island
  # space (blue - where scans and island rules begin). Paint, not a wall.
  particles-enabled: true
  # Blocks from a boundary line within which its curtain renders.
  view-distance: 32
  # Dust colors as 'r,g,b' (0-255).
  warp-ring-color: 255,64,64
  edge-color: 64,128,255

boats:
  # The boat ladder: cargo slots per boat material. A player has exactly ONE
  # boat (or none) and this is the ONLY thing that sizes their hold. Order is
  # by slots; shops list only boats bigger than yours, up to the island's tech
  # (rank <= tech level x ranks-per-tech-level). Crafting ignores tech gates.
  ranks:
    BAMBOO_RAFT: 20
    OAK_BOAT: 30
    SPRUCE_BOAT: 40
    BAMBOO_CHEST_RAFT: 50
    BIRCH_BOAT: 60
    OAK_CHEST_BOAT: 70
    JUNGLE_BOAT: 80
    SPRUCE_CHEST_BOAT: 90
    ACACIA_BOAT: 100
    BIRCH_CHEST_BOAT: 110
    DARK_OAK_BOAT: 120
    JUNGLE_CHEST_BOAT: 130
    MANGROVE_BOAT: 140
    ACACIA_CHEST_BOAT: 150
    CHERRY_BOAT: 160
    DARK_OAK_CHEST_BOAT: 170
    PALE_OAK_BOAT: 180
    MANGROVE_CHEST_BOAT: 190
    CHERRY_CHEST_BOAT: 200
    PALE_OAK_CHEST_BOAT: 210
  # Boat shop price = this x slots squared. Bamboo Raft 1000, Pale Oak Chest 110250.
  price-per-slot-squared: 250.0
  # Boat ranks sold at an island = its tech level x this (TL7 sells all 20).
  ranks-per-tech-level: 3
  # How close your own boat must be for you to move another hull's cargo into
  # it. Beyond this the option is not offered at all - cargo is not teleported
  # across the ocean; you may still take the boat itself.
  cargo-transfer-range: 200
  # The boat a boatless player is lent when they respawn (their own boat
  # dropped where they died - rowing back out to reclaim it is the recovery
  # trip). A boat-rank material name; NONE disables the loaner.
  respawn-boat: BAMBOO_RAFT
  # Minutes a dropped boat item (and the cargo riding in its record) survives
  # before the sea claims it. Persisted in the database - restarts do not
  # reset the clock.
  dropped-boat-ttl-minutes: 30

player:
  # Career restarts a destitute player may use (/tw restart). -1 unlimited, 0 none.
  max-restarts: 3
interstice:
  # Chance (0-1) that anything is waiting when a warp fails. Below 1, some failures
  # are just dark water and a long silence - unsettling in its own right, and it
  # means a failed warp is not automatically a fight.
  ghast-chance: 0.6
  # How far away ghasts appear, in blocks - close enough to see and identify, far
  # enough to decide about. They arrive without a target and acquire one only when
  # the arrival grace runs out, so a castaway can always leave before it starts.
  # Keep it under the server's monster entity-tracking-range (48 on a default
  # spigot.yml) or the client is never sent them at all.
  ghast-distance: 28
  # Give the interstice a ceiling this many blocks above its sea. A lid makes it feel
  # like somewhere you are trapped rather than an empty void. 0 leaves it open.
  ceiling-height: 48
  # Chance per chunk of a burning netherrack brazier rising out of the interstice
  # sea. They are the only light out there - without them it is a flat black nothing.
  brazier-chance: 0.18
  # Seconds after a failed warp during which nothing in the interstice may target or
  # hurt the player - long enough to read the dialog and take the free way out.
  grace-seconds: 20
  # Ghasts spawned around a stranded sailor, when any come at all.
  ghasts-min: 1
  ghasts-max: 3
  # Seconds between offers of the free re-engage while adrift.
  prompt-seconds: 20
encounters:
  # Random mob encounters at sea - the risk that balances free rowing against
  # the warp's fuel cost and interstice risk.
  enabled: true
  # Seconds between encounter rolls per player at sea.
  check-seconds: 45
  # Blocks ahead of the sailor an encounter appears - far enough to see and flee.
  distance: 28
  # Chance per roll, by the security band of the nearest island (ANARCHIC also
  # governs the deep ocean). Scaled by distance from that island.
  chance:
    SAFE: 0.02
    POLICED: 0.06
    FRONTIER: 0.12
    LAWLESS: 0.20
    ANARCHIC: 0.28
  # Chance a spawned drowned carries a trident.
  drowned-trident-chance: 0.35
  # Chance that a slain encounter mob yields booty, and what it may drop.
  # Booty is customs-stamped, so it can be sold: fighting is the third way to earn.
  booty-chance: 0.5
  booty-table:
    - NAUTILUS_SHELL
    - PRISMARINE_SHARD
    - PRISMARINE_CRYSTALS
    - GOLD_INGOT
    - IRON_INGOT
    - EMERALD
    - COAL
    - COOKED_COD
    - TRIDENT
illegal-trade:
  # The contraband list: what customs care about, and what black markets pay
  # the premium for. Only honored while illegal-trade.enabled is true.
  contraband-materials:
  - SUGAR
  # Master gate for all illegal-goods mechanics: contraband, customs scans, smuggling.
  # Set false for family-friendly servers - removes the entire crime layer cleanly.
  enabled: true
  # The safest band that will buy contraband at all. Safer ports refuse it, which is
  # what pushes smuggling runs outward - crime pays, into danger.
  # SAFE, POLICED, FRONTIER, LAWLESS or ANARCHIC.
  safest-contraband-buyer: FRONTIER
  # What a black market pays for contraband, as a multiplier on its ordinary price.
  # This is the reward half of high-risk/high-reward and the main lever on how
  # profitable smuggling is. Contraband is priced from its crafting recipe like
  # everything else, and sugar's recipe price is about one unit - so without this a
  # smuggler runs a customs patrol and is offered a dollar for the cargo.
  # Ports that deal in it always want it, so the band demand bonus applies too: the
  # rougher the port, the better it pays. Raise with care - contraband is farmable,
  # and this is the one price in the game not paid for by a purchase somewhere else.
  contraband-price-multiplier: 8.0
  # Chance (0-1) that entering an island's space triggers a customs scan, per band.
  # Safe space searches everyone; out in the lawless bands nobody is looking. Note
  # these are deliberately the inverse of who will BUY contraband: nowhere both
  # deals in it and searches hard for it.
  scan-chance:
    SAFE: 0.9
    POLICED: 0.6
    FRONTIER: 0.3
    LAWLESS: 0.1
    ANARCHIC: 0.0
  # Scan chance multipliers by standing: a clean name is worth something at the
  # border, a known offender is searched harder.
  scan-upstanding-factor: 0.4
  scan-offender-factor: 1.6
  # Minutes before the same island scans the same player again. Without this a
  # smuggler could bounce across the border re-rolling until they got a pass.
  scan-cooldown-minutes: 10
  # Minutes an island remembers a smuggler who ran from its patrol. While flagged,
  # re-entering that island's space skips the roll: the patrol simply launches.
  flee-flag-minutes: 20
  # Customs patrol size per band. 0 means that band has nobody to send.
  patrol-size:
    SAFE: 4
    POLICED: 3
    FRONTIER: 2
    LAWLESS: 1
    ANARCHIC: 0
  # The furthest a customs patrol may be from the smuggler when it launches. They
  # set out from the island's pier, but a patrol beyond the server's simulation
  # distance (10 chunks = 160 blocks by default) never ticks - it does not swim,
  # does not chase, and does nothing at all - so the launch point is pulled along
  # the line toward the smuggler until it is close enough to be alive. Keep this
  # under the monster entity-tracking-range too, or it is invisible as well as inert.
  patrol-distance: 80.0
  # How close a patrol unit must get to make the arrest, in blocks.
  caught-radius: 4.0
  # How far beyond the protection range a smuggler must get to shake the chase, and
  # the longest a chase can run before they are counted as away.
  chase-break-off-distance: 400
  chase-seconds: 120
  # Fine per contraband item seized when caught, on top of losing the cargo and the
  # reputation. A player who cannot cover it pays what they have.
  smuggling-fine-per-item: 50.0
  # Tell players when a scan finds nothing - how a player learns the mechanic exists
  # before it costs them anything.
  announce-clean-scans: true
world:
  friendly-name: TradeWinds
  world-name: tradewinds_world
  difficulty: NORMAL
  # Radius of island space in blocks (island "range"). Islands are never in sight of each other.
  distance-between-islands: 1000
  # Protection radius of trading islands in blocks.
  protection-range: 400
  start-x: 0
  start-z: 0
  island-height: 70
  use-own-generator: false
  # Sea surface level.
  sea-height: 70
  # Base y below which the ocean floor terrain noise starts.
  sea-floor: 25
  # Vary the open sea through the ocean biomes (frozen, cold, ocean, lukewarm, warm)
  # from a seeded temperature field. Transitions are gradual: warm sea never borders
  # frozen sea. False uses default-biome everywhere.
  vary-ocean-biomes: true
  # Water block for the overworld ocean.
  water-block: WATER
  # Shape of the sea floor. The seabed is not scenery: its depth picks the ocean
  # biome, and the biome is what tells vanilla where monuments, ruins and coral
  # belong. Changing any of this needs a world reset to take effect everywhere.
  seabed:
    # False gives a featureless flat floor at the shelf depth; true gives shelves,
    # basins, rifts and seamounts.
    vary: true
    # Depth below sea level of the shallowest open water - sunlit banks where
    # coral, kelp and ocean ruins sit.
    shelf-depth: 14
    # Depth below sea level of the deepest basins. Deep water gets the deep ocean
    # biomes, which is what lets vanilla place ocean monuments.
    abyss-depth: 46
    # Depth of the shelf every island and islet sits on. The natural floor blends
    # toward this near land, so an island over an abyssal plain still stands in
    # shallow water and still breaks the surface by the same amount.
    island-shelf-depth: 18
    # Amplitude of the rolling hills on top of the basins.
    relief: 9
    # How far below the surrounding floor a rift cuts at its deepest. 0 disables
    # underwater canyons.
    rift-depth: 26
    # How rare and narrow the rifts are (0-1). Higher means fewer, tighter canyons.
    rift-threshold: 0.8
    # How far a seamount rises above the floor at its peak. They only grow on the
    # deeper plains and never break the surface. 0 disables them.
    seamount-height: 20
  # Allow vanilla cave generation: caves, ravines and caverns under the sea floor
  # and inside the islands. Dry air pockets down there are a feature - somewhere
  # to surface, and something to mine.
  make-caves: true
  # Allow vanilla decoration (kelp, seagrass, coral, trees on island land).
  make-decorations: true
  # Allow vanilla structure generation: shipwrecks, ocean ruins, ocean monuments,
  # buried treasure and trial chambers. Which appear where is decided by the biomes
  # the galaxy hands out - deep basins get monuments, warm shallows get warm ruins,
  # islet beaches get treasure.
  make-structures: true
  # Keep vanilla structures off the trading islands themselves. A monument dropped
  # through a market plaza would wreck the one part of the world that is hand-built.
  # Wild islets are fair game either way.
  keep-structures-off-islands: true
  max-islands: -1
  default-game-mode: SURVIVAL
  nether:
    # The interstice: the hostile Nether-environment sea that failed warps drop players
    # into. Unreachable by any portal - warp failure is the only way in.
    generate: true
    islands: true
    sea-height: 70
    sea-floor: 25
    water-block: WATER
    create-and-link-portals: false
  end:
    # Never enable: no End means shulker shells stay unobtainable, keeping cargo
    # expanders a purchase-only money sink.
    generate: false
    islands: false
# Log detailed [TradeWinds DEBUG] lines around galaxy generation, travel and trade.
debug: false
