# TradeWinds Configuration ${version}
tradewinds:
  command:
    # Player command. What command users will run to access the game mode.
    island: tw tradewinds
    # The admin command.
    admin: twadmin
    # The default action for new player command call.
    # 'go' is the door into the ocean: it refuses if you are already at sea, and
    # returns you to the water you left rather than to spawn, so it is not a free
    # warp home. Only a sailor who has never set out starts at the spawn port.
    new-player-action: go
    # The default action for player command.
    default-action: go
ocean:
  # The ocean seed. Every island position, type, security band, biome, name and
  # route cost derives deterministically from this one number - share it and another
  # server gets the same trading ocean. 0 means: use the world seed.
  seed: 20260729
  # Minimum separation between trading island centers in blocks.
  min-separation: 2500
  # Radius in blocks around spawn inside which the starter-cluster density floor applies.
  starter-cluster-radius: 5000
  # Minimum number of trading islands guaranteed inside the starter cluster radius.
  starter-cluster-min-islands: 5
  # Chance (0.0-1.0) that a ocean grid cell hosts a trading island.
  density: 0.5
  # Radius in blocks of an island's terrain footprint (land plus underwater shelf).
  island-terrain-radius: 160
  # Blocks of terrain lift at an island's center.
  land-lift: 45
  # Distance from spawn per security-band step (Safe -> Policed -> Frontier -> Lawless -> Anarchic).
  band-radius: 5000
  # Economy of the spawn island - the trading island reserved at the world origin,
  # where players spawn and respawn. A working port: dock, plaza, market, warp zone.
  # AGRICULTURAL, FOREST, FISHING, MINING, INDUSTRIAL, LUXURY, FROZEN, or RANDOM.
  spawn-island-type: FISHING
  # Biome of the spawn island - the one direct aesthetic knob in an otherwise
  # fully seeded world, because spawn is every player's first sight of the
  # game. Any biome key, e.g. minecraft:cherry_grove; the biome also picks
  # the ground palette (a desert spawn is sand, a grove is snow). Empty keeps
  # the seeded roll from the spawn type's own biome list. Unknown keys log an
  # error and fall back to the default biome rather than breaking generation.
  spawn-island-biome: ""
  # Chance (0-1) that a wild-islet grid cell hosts one - small unnamed islands,
  # unprotected: mine, farm, build, live.
  wild-islet-chance: 0.55
  # Grid size in blocks for wild islets - much finer than the trading island grid,
  # so the open sea is dotted with land you can put ashore on: at 900 with chance
  # 0.55 there is usually one within a few hundred blocks of anywhere.
  wild-islet-grid: 900
  # Mean terrain radius of wild islets. 0 disables them. Each islet rolls its own
  # size between roughly half and one and a half times this, so the sea holds
  # everything from sandbars to proper little islands.
  wild-islet-radius: 75
  # Chance (0-1) that a wild islet is a mushroom island: mycelium, mooshrooms and
  # no hostile spawns. Rare enough to be worth the find.
  mushroom-islet-chance: 0.06
  # Chance (0-1) that a wild islet carries a small biome-appropriate vanilla
  # structure at its heart: an igloo on the snowfields, fossils in the desert,
  # a ruined portal in the jungle, an abandoned camp in the woods. Seeded and
  # deterministic per islet. Mushroom islets and pale gardens always stay
  # empty - there the biome itself is the find. 0 disables. Safe to change
  # mid-game: it only affects islets whose center chunk is not yet generated.
  islet-structure-chance: 0.25
  # Island types whose plaza carries an INN: a roofed room with a made bed you
  # may sleep in. Sleeping is otherwise impossible at sea - there is nowhere to
  # put a bed but an island of your own - and a bed you sleep in becomes your
  # respawn point, vanilla-style. Empty disables inns everywhere. Only affects
  # plazas not yet generated.
  inn-island-types:
  - LUXURY
  - AGRICULTURAL
  - FOREST
  # How far a coastline wanders in and out from the island's nominal radius, as a
  # fraction of it: bays and headlands. 0 gives perfect circles - a radial mask on
  # its own draws a coin. Above about 0.3 coasts start breaking into fragments.
  coast-roughness: 0.25
  # How much the land height varies across an island, as a fraction of its full
  # lift: hills and hollows instead of a smooth dome. 0 gives the dome.
  island-hilliness: 0.3
  # Relative spawn weight per island type. Higher = more common; 0 disables a type.
  type-weights:
    AGRICULTURAL: 10
    FOREST: 10
    FISHING: 10
    MINING: 10
    INDUSTRIAL: 8
    LUXURY: 4
    FROZEN: 8
travel:
  warp:
    # Base warp fuel cost multiplier: fuel units per block of Euclidean route distance.
    fuel-per-block: 0.01
    # Chance (0.0-1.0) that a warp fails and drops the player into the interstice.
    # Re-engaging the warp from the interstice to the original destination is always free.
    failure-chance: 0.05
    # Half-width of the offer ring around an island's visible border (the protection
    # edge - the RED particle curtain): boated players crossing it get the warp dialog.
    # Small on purpose: you should have to touch the curtain. Keep a few blocks of
    # width or ice-lane boats can cross the line between ticks.
    trigger-distance: 5
    # How far from the destination island's CENTRE a warp arrival lands. This wants
    # to be just INSIDE the warp-offer ring (protection-range minus trigger-distance,
    # with margin): landing on the ring itself reopened the warp dialog the sailor
    # had just come through. 130 put sailors inside the island's own 160-block
    # terrain footprint; 400 sat exactly on the offer ring.
    arrival-distance: 320
    # Seconds between automatic warp-dialog offers at the same island's border.
    prompt-cooldown-seconds: 30
    # Maximum destinations listed in the warp dialog (nearest first).
    # 8 fits the dialog without scrolling - scrolling is easy to miss.
    max-destinations: 8
    # Seconds a player must hold still before an engaged warp fires (moving cancels it,
    # fuel salvaged). Stops the warp being a panic button in a fight or customs chase.
    # 0 = instant. Ops and tradewinds.mod.bypassdelays holders always warp instantly.
    stand-still-seconds: 0
    # Hostile mobs within this many blocks stop a warp engaging, the way monsters
    # stop you sleeping in a bed. A warp is not a panic button out of a fight or a
    # customs chase - run, fight, or jettison. 0 disables the check.
    # The interstice re-engage is always exempt: it is the way OUT of somewhere
    # dangerous, and gating it could strand a player for good.
    enemy-radius: 12.0
    # Warping hurts - it gates the under-equipped.
    nausea-seconds: 8
    blindness-seconds: 3
    # Damage (in half-hearts) taken on warp arrival. 0 disables.
    damage: 2.0
    # Per-edge fuel cost overrides ('cx,cz>cx,cz' smaller cell first -> absolute fuel units).
    edge-overrides: {}
  fuel-warning:
    # Warn a sailor standing at a port when they cannot afford to warp anywhere from
    # it. Running dry at a port is not a soft failure - the only way onward is rowing
    # - and it is only fixable while they are still standing next to the fuel.
    enabled: true
    # Seconds between repeats of the action bar while ashore and short. It repeats
    # because an action bar fades and a one-shot is missed by exactly the players
    # this is for; the chat line and the highlighted shop button are the other two.
    repeat-seconds: 8
    # Warn when fuel is below this multiple of the cheapest route out. 1.0 warns only
    # when genuinely stuck; raise it to warn with something still in reserve.
    margin: 1.0
  # Fuel unit value per material. Fuel lives in the hold's seven dedicated fuel
  # slots - never loose pockets - and moves freely in and out of them.
  fuel-values:
    OAK_LOG: 1.0
    SPRUCE_LOG: 1.0
    BIRCH_LOG: 1.0
    JUNGLE_LOG: 1.0
    ACACIA_LOG: 1.0
    DARK_OAK_LOG: 1.0
    MANGROVE_LOG: 1.0
    CHERRY_LOG: 1.0
    PALE_OAK_LOG: 1.0
    DRIED_KELP_BLOCK: 4.0
    COAL: 8.0
    CHARCOAL: 8.0
    BLAZE_ROD: 12.0
    COAL_BLOCK: 80.0
    LAVA_BUCKET: 100.0
bands:
  # Hostile mob natural spawning inside the protection range, per security band.
  # Outside the protection range (approaches and open ocean) mobs always spawn.
  monster-natural-spawn:
    SAFE: false
    POLICED: false
    FRONTIER: true
    LAWLESS: true
    ANARCHIC: true
  # PvP inside island space, per security band.
  pvp:
    SAFE: false
    POLICED: false
    FRONTIER: false
    LAWLESS: true
    ANARCHIC: true
  # Minimum rank to hurt villagers (0 = anyone, 500 = effectively nobody).
  # SAFE prevents it outright; elsewhere it is allowed - and punished (Stage 6).
  hurt-villagers-rank:
    SAFE: 500
    POLICED: 0
    FRONTIER: 0
    LAWLESS: 0
    ANARCHIC: 0
  # Trading islands are public markets: EVERY protection flag is allowed at visitor
  # rank except a built-in deny list (anti-grief; the island's own crops, stores and
  # livestock; and direct villager trading, which would bypass the hold).
  # BentoBox flags default to member rank and nobody is ever a member of an unowned
  # island, so allow-listing instead meant finding each missing permission in play.
  # Add flag IDs here to deny them too, e.g. [BED, ENDER_PEARL].
  port-denied-flags: []
  # Flag IDs forced back to visitor rank, overriding the deny list, e.g. [HARVEST].
  port-allowed-flags: []
ranks:
  # Seafarer rank ladder: rank slug -> charted islands required. A player's rank
  # is the highest threshold at or below their charted count. Display names live
  # in the locale under tradewinds.rank.<slug> - add a locale name for any new
  # slug, keep exactly one rank at 0 so every sailor has a rank, and avoid dots
  # in slugs (YAML nests on them).
  thresholds:
    deck-hand: 0
    cabin-scout: 6
    coast-finder: 8
    bay-explorer: 10
    island-hopper: 12
    reef-runner: 15
    wave-master: 17
    chart-maker: 20
    storm-navigator: 25
    archipelago-ace: 30
    tide-captain: 36
    horizon-hunter: 42
    sea-sentinel: 49
    salty-commodore: 56
    ocean-overlord: 64
    pirate-pathfinder: 72
    grand-admiral: 81
    globe-voyager: 90
    mythic-mariner: 100
claims:
  # Price of claiming a wild islet, in whole coins. Deliberately above the top
  # boat (Pale Oak Chest Boat, 110,250 at defaults): the boat ladder comes first.
  price: 150000
  # Minimum Seafarer rank (a slug from ranks.thresholds) required to claim a
  # wild islet. Team members need no rank - only the claimer.
  minimum-rank: tide-captain
  # Blocks of protected water beyond the islet's terrain radius. The protection
  # range is islet radius + this margin.
  protection-margin: 32
crime:
  # Master switch for the whole law layer: reputation, customs scans, police and
  # bounties. False makes the world lawless in the sense of 'nothing is tracked'.
  enabled: true
  reputation:
    floor: -1000
    ceiling: 1000
    # At or above this a player is UPSTANDING: better prices, fewer scans.
    upstanding: 250
    # Below this a player is an OFFENDER - and where a paid fine returns you.
    offender: 0
    # At or below this a player is WANTED: police respond, killing them is lawful.
    wanted: -200
    # At or below this a player is a FUGITIVE: shot on sight, barred from safe trade.
    fugitive: -500
    # Minutes of ONLINE play per decay tick, and points moved toward zero each
    # tick. Credited only while online and in a TradeWinds world, so logging out
    # for a week does not launder a reputation.
    decay-minutes: 15
    decay-points: 1
  # Currency charged per point of reputation debt when paying a fine (/tw fine).
  # A fine can only ever take you back to Clean - money buys you out of Wanted,
  # not into virtue.
  fine-per-point: 20.0
  # The safest band that will still trade with a FUGITIVE. Safer ports refuse them
  # outright: having burned your name, the only markets left are where the law is
  # thin. SAFE, POLICED, FRONTIER, LAWLESS or ANARCHIC.
  safest-fugitive-trader: FRONTIER
  # Show a player's bounty beside their name (scoreboard team suffix). A bounty
  # nobody can see is not a bounty - a hunter has to be able to tell at a glance.
  # Turn OFF if the server runs TAB or another nametag plugin (they will fight over
  # the team) and render %tradewinds_bounty% there instead.
  bounty-nameplate: true
  # Reputation lost per crime.
  penalties:
    HURT_VILLAGER: -5
    KILL_VILLAGER: -25
    KILL_POLICE: -15
    KILL_INNOCENT: -100
    SMUGGLING: -30
    PASSENGER_TRADE: -20
  # Money added to the offender's bounty per crime, paid once to whoever kills
  # them while they are a lawful target.
  bounties:
    HURT_VILLAGER: 0
    KILL_VILLAGER: 1000
    KILL_POLICE: 1500
    KILL_INNOCENT: 5000
    SMUGGLING: 2000
    PASSENGER_TRADE: 1500
residents:
  # Distance from the plaza center beyond which a resident is teleported home.
  tether-radius: 24
  # Minutes before a killed resident respawns at the plaza. The market always recovers.
  respawn-delay-minutes: 10
  # Seconds between resident audits (tether check + respawn accounting).
  audit-period-seconds: 30
chart:
  # Ring radius in blocks for /tw chart's direction holograms.
  hologram-distance: 10.0
  # Seconds before chart holograms fade away.
  hologram-duration-seconds: 15
  # Maximum holograms shown at once (nearest islands first).
  hologram-max: 12
  # Islands added to a sailor's chart for free when they open the chart at a trading
  # island - the port's own harbour charts. 8 matches the warp dialog. 0 disables.
  port-scan: 8
  # How close a sailor must pass an island to chart it. Slightly beyond island waters,
  # so islands are charted as they are sighted. Only charted islands can be warped to.
  sighting-range: 1200
  # Show the hologram chart automatically whenever a player boards a boat.
  show-on-boarding: true
  # Star Chart map scale: blocks per map pixel. 64 shows ~8km across.
  starchart-blocks-per-pixel: 64
hud:
  # Navigation boss bar in island waters: island name, standing, distance to dock.
  navigation-bossbar: true
  # Distance in blocks at which the course-home bar (toggled by /tw go at sea)
  # reads empty at night; it fills as home approaches. By day the bar shows
  # direction only - the stars are the precise instrument.
  course-bar-scale: 5000
economy:
  # Money given to brand-new players with their starter kit.
  starting-balance: 2500.0
  # Coal tucked into the starter bundle - fuel for a first warp. 0 disables.
  starter-coal: 8
  # Multiplier on what players PAY an island (buying) / what an island PAYS players (selling).
  # Together these make a same-island round trip always lose money.
  buy-spread: 1.15
  sell-spread: 0.85
  # Price multiplier for categories an island produces (its own goods are cheap)
  # and demands (it pays over the odds).
  produce-factor: 0.6
  demand-factor: 1.4
  # Extra demand multiplier per security band step - margins scale with danger.
  band-demand-bonus: 0.125
  # Price tilt per tech-level step away from 4 (the neutral level): high-tech
  # islands sell FINISHED goods (metals, food) cheaper and pay more for RAW
  # goods (ores, crops, wood, fish, stone) by this fraction per step; low-tech
  # islands the inverse. The best routes are tech differentials. 0 disables.
  tech-price-step: 0.03
  # COINS of stock for a full price swing - the size of a trader's purse. A port's
  # capacity is its capacity to SPEND, not to count crates: ten diamonds are far
  # more business than ten wheat. With drift-min 0.7 a port saturates after
  # absorbing 30% of this in one category, then pays the floor until it recovers.
  drift-value-scale: 30000
  drift-min: 0.7
  drift-max: 1.3
  # Coins of stock decaying back toward equilibrium per hour - markets recover as
  # the trader works through the inventory (9000 coins saturated / 3000 = 3 hours).
  stock-decay-value-per-hour: 3000
  # Cargo expanders: first price, doubling each purchase, hard cap per player.
  expander-base-price: 50000.0
  expander-cap: 4
  # The harbourmaster's charity: a sailor with no cargo space, no boat and no money
  # is given the bare minimum to work again. Charity goods cannot be sold. 0 disables.
  charity-cooldown-minutes: 15
  # The secondhand shelf: notable goods sold to a trader go back out for sale
  # instead of vanishing, so the world feels inhabited. They surface at a DIFFERENT
  # port from the one they were sold at (the trader shipped it on), which stops
  # shelves becoming an alt-account laundering channel - you cannot predict where
  # your own goods reappear. false disables resale entirely.
  resale-enabled: true
  # Only NOTABLE goods resurface: enchanted, renamed, or worth at least this much.
  resale-notable-value: 500.0
  # Listings a port carries at once; oldest makes way. TTL in hours, 0 = forever.
  resale-slots: 2
  resale-ttl-hours: 72
  # Trader's markup on book price. Must exceed 1 or the shelf lets players buy back
  # their own goods at a profit.
  resale-markup: 1.6
  # How far a trader ships a consignment to reach another port's shelf.
  resale-ship-radius: 8000
  # The currency symbol shown before every price - "$27", "$1,728". Prices are
  # whole coins by design, so TradeWinds formats money itself rather than asking
  # the economy plugin, whose formatter may add cents and a currency name.
  currency-symbol: "$"
  # FEATURE FLAG, off by default: the price logbook and harbour reports. Parked as
  # not required for MVP (2026-08-03) - see tradewinds-salvage-plan.md for what
  # needs fixing before it returns. When true: /tw prices exists, market visits
  # write the logbook, and brokers sell harbour reports.
  price-logbook-enabled: false
  # Harbour reports: what a broker charges PER PORT to fill in your logbook, and how
  # far the report reaches per tech level of the island selling it. Gives a developed
  # port a role beyond its shelves. 0 for either disables reports.
  market-report-price-per-island: 250.0
  market-report-radius-per-tech-level: 1500.0
  # Enchantment premium: price is multiplied by (1 + quality x this), where quality
  # weights each enchantment by usefulness and level. 0 ignores enchantments.
  enchantment-price-factor: 0.05
  # Coins per potion effect, times (1 + amplifier). Every potion shares one
  # Material, so without this a Potion of Strength II prices as a water bottle.
  potion-effect-price: 150.0
  # How much value a port will handle in a SINGLE salvage item, per tech level: a
  # TL1 fishing hamlet has no use for a diamond sword and nobody there could pay
  # for one, while a TL7 hub will take anything. This is what gives loot a
  # DESTINATION - and a destination is a voyage. Recognised trade goods are exempt:
  # a port always deals in what its own shelves stock. 0 disables the gate.
  salvage-value-per-tech-level: 1500.0
  # What a port pays for SALVAGE - anything not a recognised trade good on some
  # island's shelves: mob drops, worn gear, odd blocks. A fraction of book price.
  # Keep well under 1: if scavenging and piracy pay as well as trading they replace
  # it rather than feeding it. Salvage drifts against its own stock pool, so dumping
  # junk cannot crater a port's legitimate cargo prices.
  salvage-discount: 0.375
  # Base prices (Material -> price). Anything not listed is priced by deriving from
  # its crafting recipe (BlueBook logic, embedded); underivable = untradeable.
  base-prices:
