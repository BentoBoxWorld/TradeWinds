# TradeWinds Configuration ${version}
tradewinds:
  command:
    # Player command. What command users will run to access the game mode.
    island: tw tradewinds
    # The admin command.
    admin: twadmin
    # The default action for new player command call.
    # TradeWinds players do not start with an island, so the default is 'spawn'.
    new-player-action: spawn
    # The default action for player command.
    default-action: spawn
galaxy:
  # The galaxy seed. Every island position, type, security band, biome, name and
  # route cost derives deterministically from this one number - share it and another
  # server gets the same trading galaxy. 0 means: use the world seed.
  seed: 0
  # Minimum separation between trading island centers in blocks.
  min-separation: 2500
  # Radius in blocks around spawn inside which the starter-cluster density floor applies.
  starter-cluster-radius: 5000
  # Minimum number of trading islands guaranteed inside the starter cluster radius.
  starter-cluster-min-islands: 5
  # Chance (0.0-1.0) that a galaxy grid cell hosts a trading island.
  density: 0.5
  # Radius in blocks of an island's terrain footprint (land plus underwater shelf).
  island-terrain-radius: 160
  # Blocks of terrain lift at an island's center.
  land-lift: 45
  # Distance from spawn per security-band step (Safe -> Policed -> Frontier -> Lawless -> Anarchic).
  band-radius: 5000
  # Economy of the spawn island - the trading island reserved at the world origin,
  # where players spawn and respawn. A working port: dock, plaza, market, warp zone.
  # AGRICULTURAL, FOREST, FISHING, MINING, INDUSTRIAL, LUXURY, FROZEN, or RANDOM.
  spawn-island-type: FISHING
  # Chance (0-1) that a wild-islet grid cell hosts one - small unnamed islands,
  # unprotected: mine, farm, build, live.
  wild-islet-chance: 0.55
  # Grid size in blocks for wild islets - much finer than the trading island grid,
  # so the open sea is dotted with land you can put ashore on: at 900 with chance
  # 0.55 there is usually one within a few hundred blocks of anywhere.
  wild-islet-grid: 900
  # Mean terrain radius of wild islets. 0 disables them. Each islet rolls its own
  # size between roughly half and one and a half times this, so the sea holds
  # everything from sandbars to proper little islands.
  wild-islet-radius: 75
  # Chance (0-1) that a wild islet is a mushroom island: mycelium, mooshrooms and
  # no hostile spawns. Rare enough to be worth the find.
  mushroom-islet-chance: 0.06
  # Relative spawn weight per island type. Higher = more common; 0 disables a type.
  type-weights:
    AGRICULTURAL: 10
    FOREST: 10
    FISHING: 10
    MINING: 10
    INDUSTRIAL: 8
    LUXURY: 4
    FROZEN: 8
travel:
  warp:
    # Base warp fuel cost multiplier: fuel units per block of Euclidean route distance.
    fuel-per-block: 0.01
    # Chance (0.0-1.0) that a warp fails and drops the player into the interstice.
    # Re-engaging the warp from the interstice to the original destination is always free.
    failure-chance: 0.05
    # Half-width of the offer ring around an island's visible border (the protection edge,
    # where 'Now leaving...' appears): boated players crossing it get the warp dialog.
    trigger-distance: 30
    # How far from the destination island's CENTER a warp arrival lands. Default 130:
    # inside the default view distance, so you materialize seeing your destination.
    arrival-distance: 130
    # Seconds between automatic warp-dialog offers at the same island's border.
    prompt-cooldown-seconds: 30
    # Maximum destinations listed in the warp dialog (nearest first).
    # 8 fits the dialog without scrolling - scrolling is easy to miss.
    max-destinations: 8
    # Seconds a player must hold still before an engaged warp fires (moving cancels it,
    # fuel salvaged). Stops the warp being a panic button in a fight or customs chase.
    # 0 = instant. Ops and tradewinds.mod.bypassdelays holders always warp instantly.
    stand-still-seconds: 0
    # Warping hurts - it gates the under-equipped.
    nausea-seconds: 8
    blindness-seconds: 3
    # Damage (in half-hearts) taken on warp arrival. 0 disables.
    damage: 2.0
    # Per-edge fuel cost overrides ('cx,cz>cx,cz' smaller cell first -> absolute fuel units).
    edge-overrides: {}
  # Fuel unit value per material. Fuel is consumed from the hold only: the chest
  # boat's inventory and trading bundles - never loose pockets.
  fuel-values:
    OAK_LOG: 1.0
    SPRUCE_LOG: 1.0
    BIRCH_LOG: 1.0
    JUNGLE_LOG: 1.0
    ACACIA_LOG: 1.0
    DARK_OAK_LOG: 1.0
    MANGROVE_LOG: 1.0
    CHERRY_LOG: 1.0
    DRIED_KELP_BLOCK: 4.0
    COAL: 8.0
    CHARCOAL: 8.0
    BLAZE_ROD: 12.0
    COAL_BLOCK: 80.0
    LAVA_BUCKET: 100.0
bands:
  # Hostile mob natural spawning inside the protection range, per security band.
  # Outside the protection range (approaches and open ocean) mobs always spawn.
  monster-natural-spawn:
    SAFE: false
    POLICED: false
    FRONTIER: true
    LAWLESS: true
    ANARCHIC: true
  # PvP inside island space, per security band.
  pvp:
    SAFE: false
    POLICED: false
    FRONTIER: false
    LAWLESS: true
    ANARCHIC: true
  # Minimum rank to hurt villagers (0 = anyone, 500 = effectively nobody).
  # SAFE prevents it outright; elsewhere it is allowed - and punished (Stage 6).
  hurt-villagers-rank:
    SAFE: 500
    POLICED: 0
    FRONTIER: 0
    LAWLESS: 0
    ANARCHIC: 0
residents:
  # Distance from the plaza center beyond which a resident is teleported home.
  tether-radius: 24
  # Minutes before a killed resident respawns at the plaza. The market always recovers.
  respawn-delay-minutes: 10
  # Seconds between resident audits (tether check + respawn accounting).
  audit-period-seconds: 30
chart:
  # Ring radius in blocks for /tw chart's direction holograms.
  hologram-distance: 10.0
  # Seconds before chart holograms fade away.
  hologram-duration-seconds: 15
  # Maximum holograms shown at once (nearest islands first).
  hologram-max: 12
  # Islands added to a sailor's chart for free when they open the chart at a trading
  # island - the port's own harbour charts. 8 matches the warp dialog. 0 disables.
  port-scan: 8
  # How close a sailor must pass an island to chart it. Slightly beyond island waters,
  # so islands are charted as they are sighted. Only charted islands can be warped to.
  sighting-range: 1200
  # Show the hologram chart automatically whenever a player boards a boat.
  show-on-boarding: true
  # Star Chart map scale: blocks per map pixel. 64 shows ~8km across.
  starchart-blocks-per-pixel: 64
hud:
  # Navigation boss bar in island waters: island name, standing, distance to dock.
  navigation-bossbar: true
economy:
  # Money given to brand-new players with their starter kit.
  starting-balance: 250.0
  # Coal tucked into the starter bundle - fuel for a first warp. 0 disables.
  starter-coal: 8
  # Multiplier on what players PAY an island (buying) / what an island PAYS players (selling).
  # Together these make a same-island round trip always lose money.
  buy-spread: 1.15
  sell-spread: 0.85
  # Price multiplier for categories an island produces (its own goods are cheap)
  # and demands (it pays over the odds).
  produce-factor: 0.6
  demand-factor: 1.4
  # Extra demand multiplier per security band step - margins scale with danger.
  band-demand-bonus: 0.125
  # Stock units for a full price swing; drift clamps; hourly decay toward equilibrium.
  drift-scale: 500
  drift-min: 0.7
  drift-max: 1.3
  stock-decay-per-hour: 50
  # Cargo expanders: first price, doubling each purchase, hard cap per player.
  expander-base-price: 5000.0
  expander-cap: 4
  # Maximum trading pouches (bundles) that count as hold space.
  max-bundles: 3
  # Price of a trading pouch. Deliberately cheap: with no pouch there is no hold, and
  # with no hold a player can neither buy nor sell - so a pouch is the price of
  # playing at all, not an upgrade. Flat by design: pricing by how many you carry is
  # defeated by dropping one before buying; the max-bundles cap does the limiting.
  pouch-price: 50.0
  # The harbourmaster's charity: a sailor with no cargo space, no boat and no money
  # is given the bare minimum to work again. Charity goods cannot be sold. 0 disables.
  charity-cooldown-minutes: 15
  # Give customs-stamped goods an enchantment glint as well as their lore line.
  stamp-glint: false
  # Materials traders buy even WITHOUT a customs stamp - the contraband exceptions.
  unstamped-sellables:
    - SUGAR
  # Base prices (Material -> price). Anything not listed is priced by deriving from
  # its crafting recipe (BlueBook logic, embedded); underivable = untradeable.
  base-prices:
    WHEAT: 2.0
    CARROT: 1.5
    POTATO: 1.5
    SUGAR_CANE: 1.0
    SUGAR: 1.5
    BREAD: 3.0
    COOKED_BEEF: 4.0
    COD: 2.0
    SALMON: 3.0
    OAK_LOG: 1.5
    SPRUCE_LOG: 1.5
    DARK_OAK_LOG: 1.5
    STONE: 0.5
    COAL: 4.0
    CHARCOAL: 3.0
    RAW_IRON: 6.0
    RAW_COPPER: 3.0
    RAW_GOLD: 12.0
    IRON_INGOT: 9.0
    COPPER_INGOT: 4.0
    GOLD_INGOT: 18.0
    DIAMOND: 100.0
    EMERALD: 60.0
    AMETHYST_SHARD: 10.0
    CAKE: 20.0
    GOLDEN_APPLE: 150.0
    OAK_BOAT: 20.0
    OAK_CHEST_BOAT: 60.0
    # (the full default table ships in code; add or override entries here)
player:
  # Career restarts a destitute player may use (/tw restart). -1 unlimited, 0 none.
  max-restarts: 3
interstice:
  # Ghasts spawned around a stranded sailor.
  ghasts-min: 1
  ghasts-max: 3
  # Seconds between offers of the free re-engage while adrift.
  prompt-seconds: 20
encounters:
  # Random mob encounters at sea - the risk that balances free rowing against
  # the warp's fuel cost and interstice risk.
  enabled: true
  # Seconds between encounter rolls per player at sea.
  check-seconds: 45
  # Blocks ahead of the sailor an encounter appears - far enough to see and flee.
  distance: 28
  # Chance per roll, by the security band of the nearest island (ANARCHIC also
  # governs the deep ocean). Scaled by distance from that island.
  chance:
    SAFE: 0.02
    POLICED: 0.06
    FRONTIER: 0.12
    LAWLESS: 0.20
    ANARCHIC: 0.28
  # Chance a spawned drowned carries a trident.
  drowned-trident-chance: 0.35
  # Chance that a slain encounter mob yields booty, and what it may drop.
  # Booty is customs-stamped, so it can be sold: fighting is the third way to earn.
  booty-chance: 0.5
  booty-table:
    - NAUTILUS_SHELL
    - PRISMARINE_SHARD
    - PRISMARINE_CRYSTALS
    - GOLD_INGOT
    - IRON_INGOT
    - EMERALD
    - COAL
    - COOKED_COD
    - TRIDENT
illegal-trade:
  # Master gate for all illegal-goods mechanics: contraband, customs scans, smuggling.
  # Set false for family-friendly servers - removes the entire crime layer cleanly.
  enabled: true
world:
  friendly-name: TradeWinds
  world-name: tradewinds_world
  difficulty: NORMAL
  # Radius of island space in blocks (island "range"). Islands are never in sight of each other.
  distance-between-islands: 1000
  # Protection radius of trading islands in blocks.
  protection-range: 400
  start-x: 0
  start-z: 0
  island-height: 70
  use-own-generator: false
  # Sea surface level.
  sea-height: 70
  # Base y below which the ocean floor terrain noise starts.
  sea-floor: 25
  # Vary the open sea through the ocean biomes (frozen, cold, ocean, lukewarm, warm)
  # from a seeded temperature field. Transitions are gradual: warm sea never borders
  # frozen sea. False uses default-biome everywhere.
  vary-ocean-biomes: true
  # Water block for the overworld ocean.
  water-block: WATER
  # Shape of the sea floor. The seabed is not scenery: its depth picks the ocean
  # biome, and the biome is what tells vanilla where monuments, ruins and coral
  # belong. Changing any of this needs a world reset to take effect everywhere.
  seabed:
    # False gives a featureless flat floor at the shelf depth; true gives shelves,
    # basins, rifts and seamounts.
    vary: true
    # Depth below sea level of the shallowest open water - sunlit banks where
    # coral, kelp and ocean ruins sit.
    shelf-depth: 14
    # Depth below sea level of the deepest basins. Deep water gets the deep ocean
    # biomes, which is what lets vanilla place ocean monuments.
    abyss-depth: 46
    # Depth of the shelf every island and islet sits on. The natural floor blends
    # toward this near land, so an island over an abyssal plain still stands in
    # shallow water and still breaks the surface by the same amount.
    island-shelf-depth: 18
    # Amplitude of the rolling hills on top of the basins.
    relief: 9
    # How far below the surrounding floor a rift cuts at its deepest. 0 disables
    # underwater canyons.
    rift-depth: 26
    # How rare and narrow the rifts are (0-1). Higher means fewer, tighter canyons.
    rift-threshold: 0.8
    # How far a seamount rises above the floor at its peak. They only grow on the
    # deeper plains and never break the surface. 0 disables them.
    seamount-height: 20
  # Allow vanilla cave generation: caves, ravines and caverns under the sea floor
  # and inside the islands. Dry air pockets down there are a feature - somewhere
  # to surface, and something to mine.
  make-caves: true
  # Allow vanilla decoration (kelp, seagrass, coral, trees on island land).
  make-decorations: true
  # Allow vanilla structure generation: shipwrecks, ocean ruins, ocean monuments,
  # buried treasure and trial chambers. Which appear where is decided by the biomes
  # the galaxy hands out - deep basins get monuments, warm shallows get warm ruins,
  # islet beaches get treasure.
  make-structures: true
  # Keep vanilla structures off the trading islands themselves. A monument dropped
  # through a market plaza would wreck the one part of the world that is hand-built.
  # Wild islets are fair game either way.
  keep-structures-off-islands: true
  max-islands: -1
  default-game-mode: SURVIVAL
  nether:
    # The interstice: the hostile Nether-environment sea that failed warps drop players
    # into. Unreachable by any portal - warp failure is the only way in.
    generate: true
    islands: true
    sea-height: 70
    sea-floor: 25
    water-block: WATER
    create-and-link-portals: false
  end:
    # Never enable: no End means shulker shells stay unobtainable, keeping cargo
    # expanders a purchase-only money sink.
    generate: false
    islands: false
# Log detailed [TradeWinds DEBUG] lines around galaxy generation, travel and trade.
debug: false
