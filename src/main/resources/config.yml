# TradeWinds Configuration ${version}
tradewinds:
  command:
    # Player command. What command users will run to access the game mode.
    island: tw tradewinds
    # The admin command.
    admin: twadmin
    # The default action for new player command call.
    # TradeWinds players do not start with an island, so the default is 'spawn'.
    new-player-action: spawn
    # The default action for player command.
    default-action: spawn
galaxy:
  # The galaxy seed. Every island position, type, security band, biome, name and
  # route cost derives deterministically from this one number - share it and another
  # server gets the same trading galaxy. 0 means: use the world seed.
  seed: 0
  # Minimum separation between trading island centers in blocks.
  min-separation: 2500
  # Radius in blocks around spawn inside which the starter-cluster density floor applies.
  starter-cluster-radius: 5000
  # Minimum number of trading islands guaranteed inside the starter cluster radius.
  starter-cluster-min-islands: 5
  # Chance (0.0-1.0) that a galaxy grid cell hosts a trading island.
  density: 0.5
  # Radius in blocks of an island's terrain footprint (land plus underwater shelf).
  island-terrain-radius: 160
  # Blocks of terrain lift at an island's center.
  land-lift: 45
  # Distance from spawn per security-band step (Safe -> Policed -> Frontier -> Lawless -> Anarchic).
  band-radius: 5000
  # Relative spawn weight per island type. Higher = more common; 0 disables a type.
  type-weights:
    AGRICULTURAL: 10
    FOREST: 10
    FISHING: 10
    MINING: 10
    INDUSTRIAL: 8
    LUXURY: 4
    FROZEN: 8
travel:
  warp:
    # Base warp fuel cost multiplier: fuel units per block of Euclidean route distance.
    fuel-per-block: 0.01
    # Chance (0.0-1.0) that a warp fails and drops the player into the interstice.
    # Re-engaging the warp from the interstice to the original destination is always free.
    failure-chance: 0.05
    # Half-width of the offer ring around an island's visible border (the protection edge,
    # where 'Now leaving...' appears): boated players crossing it get the warp dialog.
    trigger-distance: 30
    # How far from the destination island's CENTER a warp arrival lands. Default 130:
    # inside the default view distance, so you materialize seeing your destination.
    arrival-distance: 130
    # Seconds between automatic warp-dialog offers at the same island's border.
    prompt-cooldown-seconds: 30
    # Maximum destinations listed in the warp dialog (nearest first).
    max-destinations: 20
    # Warping hurts - it gates the under-equipped.
    nausea-seconds: 8
    blindness-seconds: 3
    # Damage (in half-hearts) taken on warp arrival. 0 disables.
    damage: 2.0
    # Per-edge fuel cost overrides ('cx,cz>cx,cz' smaller cell first -> absolute fuel units).
    edge-overrides: {}
  # Fuel unit value per material. Fuel is consumed from the hold only: the chest
  # boat's inventory and trading bundles - never loose pockets.
  fuel-values:
    OAK_LOG: 1.0
    SPRUCE_LOG: 1.0
    BIRCH_LOG: 1.0
    JUNGLE_LOG: 1.0
    ACACIA_LOG: 1.0
    DARK_OAK_LOG: 1.0
    MANGROVE_LOG: 1.0
    CHERRY_LOG: 1.0
    DRIED_KELP_BLOCK: 4.0
    COAL: 8.0
    CHARCOAL: 8.0
    BLAZE_ROD: 12.0
    COAL_BLOCK: 80.0
    LAVA_BUCKET: 100.0
bands:
  # Hostile mob natural spawning inside the protection range, per security band.
  # Outside the protection range (approaches and open ocean) mobs always spawn.
  monster-natural-spawn:
    SAFE: false
    POLICED: false
    FRONTIER: true
    LAWLESS: true
    ANARCHIC: true
  # PvP inside island space, per security band.
  pvp:
    SAFE: false
    POLICED: false
    FRONTIER: false
    LAWLESS: true
    ANARCHIC: true
  # Minimum rank to hurt villagers (0 = anyone, 500 = effectively nobody).
  # SAFE prevents it outright; elsewhere it is allowed - and punished (Stage 6).
  hurt-villagers-rank:
    SAFE: 500
    POLICED: 0
    FRONTIER: 0
    LAWLESS: 0
    ANARCHIC: 0
residents:
  # Distance from the plaza center beyond which a resident is teleported home.
  tether-radius: 24
  # Minutes before a killed resident respawns at the plaza. The market always recovers.
  respawn-delay-minutes: 10
  # Seconds between resident audits (tether check + respawn accounting).
  audit-period-seconds: 30
hud:
  # Navigation boss bar in island waters: island name, standing, distance to dock.
  navigation-bossbar: true
illegal-trade:
  # Master gate for all illegal-goods mechanics: contraband, customs scans, smuggling.
  # Set false for family-friendly servers - removes the entire crime layer cleanly.
  enabled: true
world:
  friendly-name: TradeWinds
  world-name: tradewinds_world
  difficulty: NORMAL
  # Radius of island space in blocks (island "range"). Islands are never in sight of each other.
  distance-between-islands: 1000
  # Protection radius of trading islands in blocks.
  protection-range: 400
  start-x: 0
  start-z: 0
  island-height: 70
  use-own-generator: false
  # Sea surface level.
  sea-height: 70
  # Base y below which the ocean floor terrain noise starts.
  sea-floor: 25
  # Water block for the overworld ocean.
  water-block: WATER
  # Allow vanilla cave generation under the ocean floor.
  make-caves: false
  # Allow vanilla decoration (kelp, seagrass, trees on island land).
  make-decorations: true
  # Allow vanilla structure generation (shipwrecks, ruins...).
  make-structures: false
  max-islands: -1
  default-game-mode: SURVIVAL
  nether:
    # The interstice: the hostile Nether-environment sea that failed warps drop players
    # into. Unreachable by any portal - warp failure is the only way in.
    generate: true
    islands: true
    sea-height: 70
    sea-floor: 25
    water-block: WATER
    create-and-link-portals: false
  end:
    # Never enable: no End means shulker shells stay unobtainable, keeping cargo
    # expanders a purchase-only money sink.
    generate: false
    islands: false
# Log detailed [TradeWinds DEBUG] lines around galaxy generation, travel and trade.
debug: false
