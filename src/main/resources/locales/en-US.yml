---
###########################################################################################
# This is a YML file. Be careful when editing. Check your edits in a YAML checker like    #
# the one at http://yaml-online-parser.appspot.com                                        #
###########################################################################################

tradewinds:
  general:
    worlds:
      overworld: "the open ocean"
      interstice: "the interstice"
  commands:
    help:
      description: "TradeWinds trading command"
    spawn:
      description: "teleport to the ocean spawn"
    warp:
      description: "open the warp dialog (in a boat, at an island)"
    chart:
      description: "show your chart - holograms afloat, a list ashore"
    starchart:
      description: "receive a Star Chart map of your charted islands"
    trade:
      description: "open the island market (within its protection range)"
    restart:
      description: "restart your trading career (limited uses)"
    admin:
      help:
        description: "admin command for TradeWinds"
      islands:
        description: "list the nearest trading islands"
        none: "&c No trading islands found - is the galaxy density 0?"
        header: "&b Nearest trading islands (use &e/twadmin tpisland <#>&b to visit):"
        entry: "&e [index]. &f[name] &7- [type], [band] &7at &f[x], [z] &7([distance] blocks)"
      tpisland:
        description: "teleport to a trading island from the islands list"
        parameters: "[number]"
        unknown: "&c No island with that number - run /twadmin islands first."
        teleported: "&b Arrived at [name]."
      reflag:
        description: "re-apply security-band flags to all trading islands"
        done: "&a Re-applied band flags to [number] trading islands."
  spawn:
    teleported: "&b You set sail on the open ocean."
  starter-kit:
    given: "&6 Your trading career begins: a boat, a trading bundle, and a little coal. Buy low, sell high."
  status:
    clean: "Clean"
  chart:
    charted: "Charted [name]!"
    port-scan: "&b You copy the harbour charts: [number] islands added to yours."
    holograms-shown: "&b Your chart shimmers into the air - row toward a name."
    starchart-given: "&b The Star Chart is yours - hold it to see your world."
    empty: "&c Your chart is empty - row into an island's waters to chart it."
    header: "&b Your chart ([number] islands):"
    entry: "&e [name] &7- [type], [band], [distance] blocks"
  restart:
    confirm: "&c Restart your career? Balance and kit reset; your chart is kept."
    none-left: "&c No restarts left (maximum [number])."
    done: "&6 A fresh start. Restarts remaining: [number]."
  trade:
    not-at-market: "&c There is no market here - trade within an island's protection range."
    not-stamped: "&c Traders only buy customs-stamped goods (or... certain other merchandise)."
    nothing-to-sell: "&c Nothing in your hold that this island will pay for."
    nothing-for-sale: "&c This island has nothing for sale - it only buys."
    sold: "&a Sold [amount] x [material] for $[price]."
    bought: "&a Bought [amount] x [material] for $[price]."
    cannot-afford: "&c You cannot afford that."
    no-hold-space: "&c No room in your hold - stow cargo in your chest boat, expanders or bundles."
    needs-chest-boat: "&c Expanders are stowed in a chest boat - buy one from the shipwright first."
    expander-bought: "&6 Cargo expander purchased for $[price] - carried in your pack."
    pouch-bought: "&6 Trading pouch purchased for $[price]."
    pouch-cap: "&c You cannot carry any more trading pouches."
    charity-given: "&a The harbourmaster hands you a pouch. 'Get back to work, sailor.'"
    charity-not-needed: "&c The harbourmaster looks you over. 'You'll manage.'"
    charity-cooldown: "&c 'I helped you already. Come back in [number] minutes.'"
    expander-cap: "&c Your boat cannot take any more expanders."
  interstice:
    stranded: "&4 The warp collapses! Dark water, and screaming above it."
  encounter:
    guardian_picket: "&3 Guardians rise in your path."
    drowned_raiders: "&3 Drowned surface off the bow - some carry tridents."
    nautilus_horror: "&5 Something vast and dead uncoils beneath the hull."
    phantom_flight: "&3 Wings in the dark above the mast."
    pirate_crew: "&c A crewed boat turns toward you. Pirates."
    sea_witch: "&5 A witch adrift, and she has seen you."
  warp:
    not-in-boat: "&c You need to be aboard a boat to warp."
    not-at-island: "&c The warp only engages within an island's waters."
    no-destinations: "&c No charted destinations - row into new waters first."
    not-enough-fuel: "&c Not enough fuel aboard for that jump."
    arrived: "&b The warp releases you at [name]."
    hold-course: "&b Hold your course for [seconds] seconds - the warp is spinning up..."
    course-broken: "&c You broke course - the warp fizzles out. Fuel salvaged."
