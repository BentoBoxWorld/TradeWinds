tradewinds:
  general:
    worlds:
      overworld: "the open ocean"
      interstice: "the interstice"
  commands:
    help:
      description: "TradeWinds trading command"
    spawn:
      description: "set sail - enter the ocean where you left it"
    warp:
      description: "open the warp dialog (in a boat, at an island)"
    chart:
      description: "raise the chart compass - islands, dock, and your boats ('list' for text)"
    prices:
      description: "your logbook: what ports you have called at were paying, and how long ago"
      parameters: "[category]"
      header: "<aqua>Logbook - ports you have called at:</aqua>"
      header-category: "<aqua>Logbook - best remembered prices for [value]:</aqua>"
      row: "<white>[name]</white><gray> - best: </gray><yellow>[value]</yellow><gray> ([age])</gray>"
      row-category: "<white>[name]</white><gray> paid </gray><yellow>[price]</yellow><gray> ([age])</gray>"
      nothing-logged: "<gray>Your logbook is empty. Prices are learned at the counter - call at a port and open its market.</gray>"
      unknown-category: "<red>No such kind of goods: [value]</red>"
      truncated: "<gray>...and more. Showing the first [number].</gray>"
      age-minutes: "[number]m ago"
      age-hours: "[number]h ago"
      age-days: "[number]d ago"
    starchart:
      description: "receive a Star Chart map of your charted islands"
    trade:
      description: "open the island market (within its protection range)"
    restart:
      description: "restart your trading career (limited uses)"
    fine:
      description: "settle your criminal record at a port (returns you to Clean)"
    admin:
      help:
        description: "admin command for TradeWinds"
      islands:
        description: "list the nearest trading islands"
        none: "<red>No trading islands found - is the galaxy density 0?</red>"
        header: "<aqua>Nearest trading islands (use </aqua><yellow>/twadmin tpisland <#></yellow><aqua> to visit):</aqua>"
        entry: "<yellow>[index]. </yellow><white>[name] </white><gray>- [type] (Tech [tech]), [band] at </gray><white>[x], [z] </white><gray>([distance] blocks)</gray>"
      tpisland:
        description: "teleport to a trading island from the islands list"
        parameters: "[number]"
        unknown: "<red>No island with that number - run /twadmin islands first.</red>"
        teleported: "<aqua>Arrived at [name].</aqua>"
      priceaudit:
        description: "audit price coverage: what can be sold, what is salvage, what is unsellable"
        header: "<aqua>Price audit:</aqua>"
        trade-goods: "<gray>Priced trade goods: </gray><white>[number]</white>"
        salvage: "<gray>Priced salvage: </gray><white>[number]</white>"
        unpriceable: "<gray>Unpriceable (carryable but unsellable): </gray><white>[number]</white>"
        written: "<green>Full report written to </green><white>[file]</white>"
        write-failed: "<red>Could not write the report - see the console.</red>"
      customs:
        description: "show what customs make of you here: contraband aboard, scan odds, patrol"
        header: "<aqua>Customs report:</aqua>"
        gate: "<gray>Crime layer enabled: </gray><white>[value]</white>"
        contraband: "<gray>Contraband list: </gray><white>[value]</white>"
        aboard: "<gray>Contraband in your hold: </gray><white>[number]</white>"
        standing: "<gray>Your standing: </gray><white>[value]</white>"
        open-sea: "<gray>Open sea - no island space here, so nothing to scan you.</gray>"
        island: "<gray>Island space: </gray><white>[name]</white><gray> ([band])</gray>"
        scan-chance: "<gray>Scan chance on entry: </gray><white>[value]</white>"
        buys: "<gray>This port buys contraband: </gray><white>[value]</white>"
        patrol: "<gray>Patrol it can field: </gray><white>[number]</white>"
        chased: "<gray>Chase in progress: </gray><white>[value]</white>"
      warpfail:
        description: "rig a player's next warp to fail (run again to clear)"
        parameters: "<player>"
        rigged: "<gold>[name]'s next warp will fail. Run this again to clear it.</gold>"
        cleared: "<green>[name]'s warp is no longer rigged.</green>"
      reflag:
        description: "re-apply security-band flags to all trading islands"
        done: "<green>Re-applied band flags to [number] trading islands.</green>"
  spawn:
    teleported: "<aqua>You come ashore at the spawn port. Your boat is your hold and your livelihood - keep it close.</aqua>"
    resumed: "<aqua>You take up your voyage where you left it.</aqua>"
    already-at-sea: "<red>You are already at sea. There is no commanding your way across it - row, or warp from an island's border.</red>"
  starter-kit:
    given: "<gold>Your trading career begins with an Oak Boat: 3 cargo slots, coal in the fuel tank. The boat IS your hold - right-click it to open. Buy low, sell high.</gold>"
  standing:
    upstanding: "<green>Upstanding</green>"
    clean: "<white>Clean</white>"
    offender: "<yellow>Offender</yellow>"
    wanted: "<red>Wanted</red>"
    fugitive: "<dark_red>Fugitive</dark_red>"
    changed: "[title]<gray>Your standing</gray>[subtitle][standing]"
  crime:
    hurt-villager: "<red>The market saw that. Reputation -[number].</red>"
    kill-villager: "<red>A trader is dead. Reputation -[number], and there is money on your head.</red>"
    kill-police: "<red>You killed a patrol. Reputation -[number].</red>"
    kill-innocent: "<dark_red>Murder. Reputation -[number], and a price on your head.</dark_red>"
    smuggling: "<red>Caught with contraband. Reputation -[number].</red>"
    passenger-trade: "<red>Word travels. Reputation -[number].</red>"
    bounty-paid: "<gold>Bounty collected on [name]: [amount].</gold>"
    fine-none: "<green>You have nothing to answer for.</green>"
    fine-quote: "<yellow>The harbourmaster totals your record: [amount] to settle it.</yellow>"
    fine-paid: "<green>Fine paid. Your record is clear - your name is another matter.</green>"
    fine-cannot-afford: "<red>You cannot afford the fine ([amount]).</red>"
    fine-no-market: "<red>Fines are paid at a trading island, not out here.</red>"
    fine-barred: "<red>'We don't take money from your sort.' Try a rougher port.</red>"
  police:
    responding: "<dark_red>[name] has patrols out for you. They will not follow you past the border.</dark_red>"
    broken-off: "<gray>The patrol turns back at the border.</gray>"
    bounty-tag: "<red> [[amount]]</red>"
  customs:
    clean: "<gray>Customs board you, look through the hold, and wave you on.</gray>"
    detected: "[title]<dark_red>CUSTOMS</dark_red>[subtitle]<red>Patrol dispatched from [name]</red>"
    detected-chat: "<dark_red>[name] customs inspect your hold: [number] items of contraband. A patrol is launched - run, fight, or dump the cargo.</dark_red>"
    seized: "<dark_red>You are ashore in the market with contraband. Customs simply take it: [number] items seized, [amount] in fines.</dark_red>"
    flagged: "<dark_red>[name] remembers you. No inspection this time - the patrol is already coming.</dark_red>"
    jettisoned: "<green>Your cargo goes over the side. The patrol turns back - nothing to find.</green>"
    escaped: "<gold>Open water. [name] loses you - but its harbourmaster will not forget.</gold>"
    called-off: "<gray>[name]'s patrol gives up the search and turns for home. You still have the cargo.</gray>"
    caught: "<dark_red>Boarded. [number] items seized, [amount] in fines, and [name] has your name.</dark_red>"
  band:
    safe: "<blue>Safe</blue>"
    policed: "<green>Policed</green>"
    frontier: "<yellow>Frontier</yellow>"
    lawless: "<red>Lawless</red>"
    anarchic: "<dark_red><bold>ANARCHIC</bold></dark_red>"
  fuel:
    low-actionbar: "[actionbar]<gold>LOW FUEL</gold><gray> - [fuel]/[needed] to warp out. Buy fuel at the market.</gray>"
    low-chat: "<gold>Low fuel at this port.</gold><gray> You have [fuel] units; the cheapest warp from here needs [needed]. Buy at least [number] more from the market before you leave, or you will be rowing.</gray>"
  hud:
    navigation: "<aqua>[name]</aqua><white> | </white><gray>Tech [tech]</gray><white> | </white>[band]<white> | [standing] | </white><yellow>Dock [distance]m</yellow>"
  hologram:
    island: "<aqua>[name]</aqua><newline><gray>[type] T[tech], </gray>[band]<newline><yellow>[distance]m</yellow>"
    boat: "<green><bold>BOAT</bold></green><newline><yellow>[distance]m</yellow>"
    old-boat: "<red><bold>OLD BOAT</bold></red><newline><yellow>[distance]m</yellow>"
    dock: "<gold><bold>DOCK</bold></gold><newline><gray>[name]</gray><newline><yellow>[distance]m</yellow>"
  ui:
    capture:
      title: "<dark_aqua>The [material]</dark_aqua>"
      body: "<gray>Take the [taking] and it becomes your ship - your [leaving], and everything in it, is left behind unowned for anyone to take. Find it again with </gray><yellow>/tw chart</yellow><gray>.</gray>"
      body-no-boat: "<gray>You have no ship. Take the [taking] and it is yours, cargo and all.</gray>"
      body-cargo: "<gray>It carries </gray><white>[cargo] items</white><gray>.</gray>"
      body-too-far: "<gray>Your [leaving] is too far off to load - cargo does not cross the ocean on its own.</gray>"
      confirm: "<green>Take the [material]</green>"
      confirm-tooltip: "<gray>Your old boat and its cargo stay where they are</gray>"
      transfer: "<yellow>Take only the cargo</yellow>"
      transfer-tooltip: "<gray>Move what it carries into your own hold and leave the hull</gray>"
      cancel: "<red>Leave it</red>"
    market:
