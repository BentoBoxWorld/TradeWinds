---
###########################################################################################
# This is a YML file. Be careful when editing. Check your edits in a YAML checker like    #
# the one at http://yaml-online-parser.appspot.com                                        #
#                                                                                         #
# Colour and formatting use MiniMessage tags: <red>text</red>, <gold>text</gold> and so   #
# on. Legacy ampersand codes are deprecated - do not add new ones.                        #
###########################################################################################

tradewinds:
  general:
    worlds:
      overworld: "the open ocean"
      interstice: "the interstice"
  commands:
    help:
      description: "TradeWinds trading command"
    spawn:
      description: "teleport to the ocean spawn"
    warp:
      description: "open the warp dialog (in a boat, at an island)"
    chart:
      description: "show your chart - holograms afloat, a list ashore"
    starchart:
      description: "receive a Star Chart map of your charted islands"
    trade:
      description: "open the island market (within its protection range)"
    restart:
      description: "restart your trading career (limited uses)"
    fine:
      description: "settle your criminal record at a port (returns you to Clean)"
    admin:
      help:
        description: "admin command for TradeWinds"
      islands:
        description: "list the nearest trading islands"
        none: "<red>No trading islands found - is the galaxy density 0?</red>"
        header: "<aqua>Nearest trading islands (use </aqua><yellow>/twadmin tpisland <#></yellow><aqua> to visit):</aqua>"
        entry: "<yellow>[index]. </yellow><white>[name] </white><gray>- [type], [band] at </gray><white>[x], [z] </white><gray>([distance] blocks)</gray>"
      tpisland:
        description: "teleport to a trading island from the islands list"
        parameters: "[number]"
        unknown: "<red>No island with that number - run /twadmin islands first.</red>"
        teleported: "<aqua>Arrived at [name].</aqua>"
      customs:
        description: "show what customs make of you here: contraband aboard, scan odds, patrol"
        header: "<aqua>Customs report:</aqua>"
        gate: "<gray>Crime layer enabled: </gray><white>[value]</white>"
        contraband: "<gray>Contraband list: </gray><white>[value]</white>"
        aboard: "<gray>Contraband in your hold: </gray><white>[number]</white>"
        standing: "<gray>Your standing: </gray><white>[value]</white>"
        open-sea: "<gray>Open sea - no island space here, so nothing to scan you.</gray>"
        island: "<gray>Island space: </gray><white>[name]</white><gray> ([band])</gray>"
        scan-chance: "<gray>Scan chance on entry: </gray><white>[value]</white>"
        buys: "<gray>This port buys contraband: </gray><white>[value]</white>"
        patrol: "<gray>Patrol it can field: </gray><white>[number]</white>"
        chased: "<gray>Chase in progress: </gray><white>[value]</white>"
      reflag:
        description: "re-apply security-band flags to all trading islands"
        done: "<green>Re-applied band flags to [number] trading islands.</green>"
  spawn:
    teleported: "<aqua>You set sail on the open ocean.</aqua>"
  starter-kit:
    given: "<gold>Your trading career begins: a boat, a trading pouch, and a little coal. Buy low, sell high.</gold>"
  standing:
    upstanding: "<green>Upstanding</green>"
    clean: "<white>Clean</white>"
    offender: "<yellow>Offender</yellow>"
    wanted: "<red>Wanted</red>"
    fugitive: "<dark_red>Fugitive</dark_red>"
    changed: "[title]<gray>Your standing</gray>[subtitle][standing]"
  crime:
    hurt-villager: "<red>The market saw that. Reputation -[number].</red>"
    kill-villager: "<red>A trader is dead. Reputation -[number], and there is money on your head.</red>"
    kill-police: "<red>You killed a patrol. Reputation -[number].</red>"
    kill-innocent: "<dark_red>Murder. Reputation -[number], and a price on your head.</dark_red>"
    smuggling: "<red>Caught with contraband. Reputation -[number].</red>"
    passenger-trade: "<red>Word travels. Reputation -[number].</red>"
    bounty-paid: "<gold>Bounty collected on [name]: [amount].</gold>"
    fine-none: "<green>You have nothing to answer for.</green>"
    fine-quote: "<yellow>The harbourmaster totals your record: [amount] to settle it.</yellow>"
    fine-paid: "<green>Fine paid. Your record is clear - your name is another matter.</green>"
    fine-cannot-afford: "<red>You cannot afford the fine ([amount]).</red>"
    fine-no-market: "<red>Fines are paid at a trading island, not out here.</red>"
    fine-barred: "<red>'We don't take money from your sort.' Try a rougher port.</red>"
  customs:
    clean: "<gray>Customs board you, look through the hold, and wave you on.</gray>"
    detected: "[title]<dark_red>CUSTOMS</dark_red>[subtitle]<red>Patrol dispatched from [name]</red>"
    detected-chat: "<dark_red>[name] customs inspect your hold: [number] items of contraband. A patrol is launched - run, fight, or dump the cargo.</dark_red>"
    seized: "<dark_red>You are ashore in the market with contraband. Customs simply take it: [number] items seized, [amount] in fines.</dark_red>"
    flagged: "<dark_red>[name] remembers you. No inspection this time - the patrol is already coming.</dark_red>"
    jettisoned: "<green>Your cargo goes over the side. The patrol turns back - nothing to find.</green>"
    escaped: "<gold>Open water. [name] loses you - but its harbourmaster will not forget.</gold>"
    caught: "<dark_red>Boarded. [number] items seized, [amount] in fines, and [name] has your name.</dark_red>"
  hud:
    navigation: "<aqua>[name]</aqua><white> | [standing] | </white><yellow>Dock [distance]m</yellow>"
  hologram:
    island: "<aqua>[name]</aqua><newline><gray>[type], [band]</gray><newline><yellow>[distance]m</yellow>"
  ui:
    market:
      title: "<dark_aqua>[name] Market</dark_aqua>"
      subtitle: "<gray>[type], [band]</gray>"
      status: "<gray>Balance: $[balance]  |  Hold space: ~[space] items</gray>"
      sell: "<yellow>Sell cargo</yellow>"
      sell-tooltip: "<gray>Sell your hold's goods here</gray>"
      buy: "<aqua>Buy goods</aqua>"
      buy-tooltip: "<gray>Buy this island's trade goods into your hold</gray>"
      outfitter: "<green>Outfitter</green>"
      outfitter-tooltip: "<gray>Food, fuel and gear - straight to your pack</gray>"
      shipwright: "<gold>Shipwright</gold>"
      shipwright-tooltip: "<gray>Boats, chest boats and cargo expanders</gray>"
      back: "<gray>< Back</gray>"
      back-tooltip: "<gray>Back to the market menu</gray>"
      close: "<gray>Close</gray>"
      selling-title: "<dark_aqua>[name] - Selling</dark_aqua>"
      selling-body: "<gray>The island pays for goods in your hold</gray>"
      selling-truncated: "<gray>(showing the first [number] cargo types - sell some to see the rest)</gray>"
      buying-title: "<dark_aqua>[name] - Buying</dark_aqua>"
      buying-body: "<gray>Goods sold into your hold - customs stamped</gray>"
      outfitter-title: "<dark_aqua>[name] - Outfitter</dark_aqua>"
      outfitter-body: "<gray>Stores for the sailing life - food, fuel and gear</gray>"
      shipwright-title: "<dark_aqua>[name] - Shipwright</dark_aqua>"
      shipwright-body: "<gray>Hulls and holds. Smart sailors craft their own boats from wild timber.</gray>"
      sell-one: "<yellow>[material] x1</yellow>"
      sell-batch: "<yellow>[material] x[amount]</yellow>"
      sell-all: "<gold>All [amount] - $[price]</gold>"
      sell-tooltip-each: "<gray>$[price] each</gray>"
      buy-one: "<aqua>[material] x1 - $[price]</aqua>"
      buy-batch: "<aqua>x[amount] - $[price]</aqua>"
      buy-tooltip-each: "<gray>$[price] each; limited by balance and hold space</gray>"
      outfit-one: "<green>[material] x1 - $[price]</green>"
      outfit-batch: "<green>x[amount] - $[price]</green>"
      outfit-tooltip: "<gray>$[price] each - carried in your pack, not the hold</gray>"
      hull: "<gold>[material] - $[price]</gold>"
      hull-tooltip: "<gray>Delivered to your inventory - place it at the dock</gray>"
      pouch: "<gold>Trading Pouch - $[price]</gold>"
      pouch-tooltip: "<gray>Holds 64 items ([owned]/[cap] carried). Cargo expanders carry 27 stacks each.</gray>"
      expander: "<gold>Cargo Expander - $[price]</gold>"
      expander-tooltip: "<gray>27 stacks of cargo space ([owned]/[cap] owned). Price doubles each time. Carried in your pack.</gray>"
      charity: "<green>Harbourmaster's charity</green>"
      charity-tooltip: "<gray>Shipwrecked and penniless? Take a pouch, and a boat if you need one.</gray>"
    warp:
      title: "<dark_aqua>Warp - [name]</dark_aqua>"
      fuel: "<aqua>Fuel aboard: [amount] units</aqua>"
      destination: "<white>[name] - [fuel] fuel</white>"
      destination-poor: "<dark_gray>[name] - [fuel] fuel</dark_gray>"
      destination-tooltip: "<gray>[type], [band], [distance] blocks</gray>"
    interstice:
      title: "<dark_purple>The Interstice</dark_purple>"
      body: "<gray>Dark water, and something screaming above it. Your course is still paid for.</gray>"
      re-engage: "<aqua>Re-engage the warp to [name]</aqua>"
      re-engage-tooltip: "<gray>Free - the fuel was spent when you first engaged</gray>"
  item:
    pouch: "<gold>Trading Pouch</gold>"
    pouch-lore: "<gray>Cargo space. Stow goods to sell them.</gray>"
    expander: "<gold>Cargo Expander</gold>"
    expander-lore: "<gray>Expands your hold. Right-click to open.</gray>"
    stamp: "<dark_aqua>Customs Stamped</dark_aqua>"
    starchart: "<aqua>Star Chart</aqua>"
    expander-view: "<dark_aqua>Cargo Expander</dark_aqua>"
  chart:
    charted: "[actionbar]<aqua>Charted <white>[name]</white>!</aqua>"
    port-scan: "<aqua>You copy the harbour charts: [number] islands added to yours.</aqua>"
    holograms-shown: "<aqua>Your chart shimmers into the air - row toward a name.</aqua>"
    starchart-given: "<aqua>The Star Chart is yours - hold it to see your world.</aqua>"
    empty: "<red>Your chart is empty - row into an island's waters to chart it.</red>"
    header: "<aqua>Your chart ([number] islands):</aqua>"
    entry: "<yellow>[name] </yellow><gray>- [type], [band], [distance] blocks</gray>"
  restart:
    confirm: "<red>Restart your career? Balance and kit reset; your chart is kept.</red>"
    none-left: "<red>No restarts left (maximum [number]).</red>"
    done: "<gold>A fresh start. Restarts remaining: [number].</gold>"
  trade:
    not-at-market: "<red>There is no market here - trade within an island's protection range.</red>"
    not-stamped: "<red>Traders only buy customs-stamped goods (or... certain other merchandise).</red>"
    contraband-refused: "<red>The trader looks at what you are offering, then at you. 'Not here. Try a rougher port.'</red>"
    nothing-to-sell: "<red>Nothing in your hold that this island will pay for.</red>"
    nothing-for-sale: "<red>This island has nothing for sale - it only buys.</red>"
    sold: "<green>Sold [amount] x [material] for $[price].</green>"
    bought: "<green>Bought [amount] x [material] for $[price].</green>"
    cannot-afford: "<red>You cannot afford that.</red>"
    no-hold-space: "<red>No room in your hold - stow cargo in a pouch, an expander or your chest boat.</red>"
    needs-chest-boat: "<red>Expanders are stowed in a chest boat - buy one from the shipwright first.</red>"
    expander-bought: "<gold>Cargo expander purchased for $[price] - carried in your pack.</gold>"
    pouch-bought: "<gold>Trading pouch purchased for $[price].</gold>"
    pouch-cap: "<red>You cannot carry any more trading pouches.</red>"
    charity-given: "<green>The harbourmaster hands you a pouch. 'Get back to work, sailor.'</green>"
    charity-not-needed: "<red>The harbourmaster looks you over. 'You'll manage.'</red>"
    charity-cooldown: "<red>'I helped you already. Come back in [number] minutes.'</red>"
    expander-cap: "<red>Your boat cannot take any more expanders.</red>"
  interstice:
    stranded: "<dark_red>The warp collapses! Dark water, and screaming above it.</dark_red>"
  encounter:
    guardian_picket: "<dark_aqua>Guardians rise in your path.</dark_aqua>"
    drowned_raiders: "<dark_aqua>Drowned surface off the bow - some carry tridents.</dark_aqua>"
    deep_terror: "<dark_purple>Something vast and ancient rises from the deep. Run.</dark_purple>"
    phantom_flight: "<dark_aqua>Wings in the dark above the mast.</dark_aqua>"
    pirate_crew: "<red>A crewed boat turns toward you. Pirates.</red>"
    sea_witch: "<dark_purple>A witch adrift, and she has seen you.</dark_purple>"
  warp:
    not-in-boat: "<red>You need to be aboard a boat to warp.</red>"
    not-at-island: "<red>The warp only engages within an island's waters.</red>"
    no-destinations: "<red>No charted destinations - row into new waters first.</red>"
    not-enough-fuel: "<red>Not enough fuel aboard for that jump.</red>"
    arrived: "<aqua>The warp releases you at [name].</aqua>"
    hold-course: "<aqua>Hold your course for [seconds] seconds - the warp is spinning up...</aqua>"
    course-broken: "<red>You broke course - the warp fizzles out. Fuel salvaged.</red>"
