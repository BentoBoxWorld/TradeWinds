      outfitter-fuel-tooltip: "<yellow>You cannot warp anywhere without more fuel. Buy charcoal here.</yellow>"
      buy-fuel: "<gold><bold>BUY FUEL HERE</bold></gold><aqua> - Buy goods</aqua>"
      buy-fuel-tooltip: "<yellow>You cannot warp anywhere without more fuel. This island sells it.</yellow>"
