---
###########################################################################################
# This is a YML file. Be careful when editing. Check your edits in a YAML checker like    #
# the one at http://yaml-online-parser.appspot.com                                        #
#                                                                                         #
# Colour and formatting use MiniMessage tags: <red>text</red>, <gold>text</gold> and so   #
# on. Legacy ampersand codes are deprecated - do not add new ones.                        #
###########################################################################################

tradewinds:
  general:
    worlds:
      overworld: "the open ocean"
      interstice: "the interstice"
  commands:
    help:
      description: "TradeWinds trading command"
    spawn:
      description: "teleport to the ocean spawn"
    warp:
      description: "open the warp dialog (in a boat, at an island)"
    chart:
      description: "show your chart - holograms afloat, a list ashore"
    starchart:
      description: "receive a Star Chart map of your charted islands"
    trade:
      description: "open the island market (within its protection range)"
    restart:
      description: "restart your trading career (limited uses)"
    admin:
      help:
        description: "admin command for TradeWinds"
      islands:
        description: "list the nearest trading islands"
        none: "<red>No trading islands found - is the galaxy density 0?</red>"
        header: "<aqua>Nearest trading islands (use </aqua><yellow>/twadmin tpisland <#></yellow><aqua> to visit):</aqua>"
        entry: "<yellow>[index]. </yellow><white>[name] </white><gray>- [type], [band] at </gray><white>[x], [z] </white><gray>([distance] blocks)</gray>"
      tpisland:
        description: "teleport to a trading island from the islands list"
        parameters: "[number]"
        unknown: "<red>No island with that number - run /twadmin islands first.</red>"
        teleported: "<aqua>Arrived at [name].</aqua>"
      reflag:
        description: "re-apply security-band flags to all trading islands"
        done: "<green>Re-applied band flags to [number] trading islands.</green>"
  spawn:
    teleported: "<aqua>You set sail on the open ocean.</aqua>"
  starter-kit:
    given: "<gold>Your trading career begins: a boat, a trading pouch, and a little coal. Buy low, sell high.</gold>"
  status:
    clean: "Clean"
  chart:
    charted: "<aqua>Charted <white>[name]</white>!</aqua>"
    port-scan: "<aqua>You copy the harbour charts: [number] islands added to yours.</aqua>"
    holograms-shown: "<aqua>Your chart shimmers into the air - row toward a name.</aqua>"
    starchart-given: "<aqua>The Star Chart is yours - hold it to see your world.</aqua>"
    empty: "<red>Your chart is empty - row into an island's waters to chart it.</red>"
    header: "<aqua>Your chart ([number] islands):</aqua>"
    entry: "<yellow>[name] </yellow><gray>- [type], [band], [distance] blocks</gray>"
  restart:
    confirm: "<red>Restart your career? Balance and kit reset; your chart is kept.</red>"
    none-left: "<red>No restarts left (maximum [number]).</red>"
    done: "<gold>A fresh start. Restarts remaining: [number].</gold>"
  trade:
    not-at-market: "<red>There is no market here - trade within an island's protection range.</red>"
    not-stamped: "<red>Traders only buy customs-stamped goods (or... certain other merchandise).</red>"
    nothing-to-sell: "<red>Nothing in your hold that this island will pay for.</red>"
    nothing-for-sale: "<red>This island has nothing for sale - it only buys.</red>"
    sold: "<green>Sold [amount] x [material] for $[price].</green>"
    bought: "<green>Bought [amount] x [material] for $[price].</green>"
    cannot-afford: "<red>You cannot afford that.</red>"
    no-hold-space: "<red>No room in your hold - stow cargo in a pouch, an expander or your chest boat.</red>"
    needs-chest-boat: "<red>Expanders are stowed in a chest boat - buy one from the shipwright first.</red>"
    expander-bought: "<gold>Cargo expander purchased for $[price] - carried in your pack.</gold>"
    pouch-bought: "<gold>Trading pouch purchased for $[price].</gold>"
    pouch-cap: "<red>You cannot carry any more trading pouches.</red>"
    charity-given: "<green>The harbourmaster hands you a pouch. 'Get back to work, sailor.'</green>"
    charity-not-needed: "<red>The harbourmaster looks you over. 'You'll manage.'</red>"
    charity-cooldown: "<red>'I helped you already. Come back in [number] minutes.'</red>"
    expander-cap: "<red>Your boat cannot take any more expanders.</red>"
  interstice:
    stranded: "<dark_red>The warp collapses! Dark water, and screaming above it.</dark_red>"
  encounter:
    guardian_picket: "<dark_aqua>Guardians rise in your path.</dark_aqua>"
    drowned_raiders: "<dark_aqua>Drowned surface off the bow - some carry tridents.</dark_aqua>"
    deep_terror: "<dark_purple>Something vast and ancient rises from the deep. Run.</dark_purple>"
    phantom_flight: "<dark_aqua>Wings in the dark above the mast.</dark_aqua>"
    pirate_crew: "<red>A crewed boat turns toward you. Pirates.</red>"
    sea_witch: "<dark_purple>A witch adrift, and she has seen you.</dark_purple>"
  warp:
    not-in-boat: "<red>You need to be aboard a boat to warp.</red>"
    not-at-island: "<red>The warp only engages within an island's waters.</red>"
    no-destinations: "<red>No charted destinations - row into new waters first.</red>"
    not-enough-fuel: "<red>Not enough fuel aboard for that jump.</red>"
    arrived: "<aqua>The warp releases you at [name].</aqua>"
    hold-course: "<aqua>Hold your course for [seconds] seconds - the warp is spinning up...</aqua>"
    course-broken: "<red>You broke course - the warp fizzles out. Fuel salvaged.</red>"
