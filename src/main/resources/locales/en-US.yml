      outfit-batch: "<green>x[amount] - $[price]</green>"
      outfit-tooltip: "<gray>$[price] each - carried in your pack, not the hold</gray>"
      hull: "<gold>[material] - $[price]</gold>"
      hull-tooltip: "<gray>[slots] cargo slots. Replaces your current boat; contents stay put.</gray>"
      pouch: "<gold>Trading Pouch - $[price]</gold>"
