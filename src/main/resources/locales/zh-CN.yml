---
###########################################################################################
# 这是一个 YML 文件，编辑时请小心。可以用 YAML 检查器（例如                               #
# http://yaml-online-parser.appspot.com）核对你的修改。                                  #
#                                                                                         #
# 颜色和格式使用 MiniMessage 标签：<red>文字</red>、<gold>文字</gold> 等。                 #
# 旧式 & 颜色代码已弃用，请勿再添加。                                                     #
###########################################################################################

tradewinds:
  general:
    worlds:
      overworld: "开阔海洋"
      interstice: "间隙之海"
    # 用于缺少数值的地方：暂无价格、名字未知
    none: "-"
    unknown: "?"
  commands:
    help:
      description: "TradeWinds 贸易命令"
    spawn:
      description: "起航 - 回到你上次离开海洋的地方"
    warp:
      description: "打开跃迁对话框（需在岛屿水域内乘船）"
    chart:
      description: "升起海图罗盘 - 岛屿、码头和你的船（加 'list' 显示文字）"
    prices:
      description: "你的航海日志：你到访过的港口曾出什么价，以及多久之前"
      parameters: "[category]"
      header: "<aqua>航海日志 - 你到访过的港口：</aqua>"
      header-category: "<aqua>航海日志 - 记忆中 [value] 的最佳价格：</aqua>"
      row: "<white>[name]</white><gray> - 最佳：</gray><yellow>[value]</yellow><gray>（[age]）</gray>"
      row-category: "<white>[name]</white><gray> 出价 </gray><yellow>[price]</yellow><gray>（[age]）</gray>"
      nothing-logged: "<gray>你的航海日志是空的。价格要在柜台前学到 - 到访一个港口，打开它的市场。</gray>"
      unknown-category: "<red>没有这种货物：[value]</red>"
      truncated: "<gray>……还有更多。只显示前 [number] 条。</gray>"
      age-minutes: "[number] 分钟前"
      age-hours: "[number] 小时前"
      age-days: "[number] 天前"
    starchart:
      description: "领取一张标有你已测绘岛屿的星图"
    trade:
      description: "打开岛屿市场（需在其保护范围内）"
    restart:
      description: "重新开始你的贸易生涯（次数有限）"
    fine:
      description: "在港口了结你的犯罪记录（恢复为清白）"
    rank:
      description: "你的航海者等级，以及按测绘岛屿数排名的前十名水手"
    claim:
      description: "认领你脚下的荒野小岛作为你的岛屿"
    sethome:
      description: "设置你的家（需站在自己的岛屿上）"
    home:
      description: "前往你的家（需站在自己的岛屿上）"
    unclaim:
      description: "把你认领的小岛还给荒野（仅限岛主，队伍必须为空，不退款）"
    admin:
      help:
        description: "TradeWinds 管理命令"
      islands:
        description: "列出最近的贸易岛屿"
        none: "<red>找不到贸易岛屿 - 海洋密度是 0 吗？</red>"
        header: "<aqua>最近的贸易岛屿（用 </aqua><yellow>/twadmin tpisland <#></yellow><aqua> 前往）：</aqua>"
        entry: "<yellow>[index]. </yellow><white>[name] </white><gray>- [type]（科技 [tech]），[band]，位于 </gray><white>[x], [z] </white><gray>（[distance] 格）</gray>"
      tpisland:
        description: "传送到岛屿列表中的某个贸易岛屿"
        parameters: "[number]"
        unknown: "<red>没有这个编号的岛屿 - 请先运行 /twadmin islands。</red>"
        teleported: "<aqua>已到达 [name]。</aqua>"
      priceaudit:
        description: "审计价格覆盖：哪些可出售、哪些是打捞品、哪些无法出售"
        header: "<aqua>价格审计：</aqua>"
        trade-goods: "<gray>已定价的贸易货物：</gray><white>[number]</white>"
        salvage: "<gray>已定价的打捞品：</gray><white>[number]</white>"
        unpriceable: "<gray>无法定价（可携带但不可出售）：</gray><white>[number]</white>"
        written: "<green>完整报告已写入 </green><white>[file]</white>"
        write-failed: "<red>无法写入报告 - 请查看控制台。</red>"
      customs:
        description: "显示海关对你的看法：船上违禁品、检查几率、巡逻队"
        header: "<aqua>海关报告：</aqua>"
        gate: "<gray>犯罪系统已启用：</gray><white>[value]</white>"
        contraband: "<gray>违禁品列表：</gray><white>[value]</white>"
        aboard: "<gray>你货舱中的违禁品：</gray><white>[number]</white>"
        standing: "<gray>你的声望：</gray><white>[value]</white>"
        open-sea: "<gray>公海 - 这里不属于任何岛屿，没有人会检查你。</gray>"
        island: "<gray>岛屿水域：</gray><white>[name]</white><gray>（[band]）</gray>"
        scan-chance: "<gray>入境检查几率：</gray><white>[value]</white>"
        buys: "<gray>此港口收购违禁品：</gray><white>[value]</white>"
        patrol: "<gray>可派出的巡逻队：</gray><white>[number]</white>"
        chased: "<gray>追捕进行中：</gray><white>[value]</white>"
      warpfail:
        description: "让某玩家的下一次跃迁失败（再次运行以取消）"
        parameters: "<player>"
        rigged: "<gold>[name] 的下一次跃迁将会失败。再次运行此命令可取消。</gold>"
        cleared: "<green>[name] 的跃迁不再被动过手脚。</green>"
      rank:
        description: "查看或设置玩家的航海者等级（按等级名、岛屿数，或 'reset'）"
        parameters: "<player> [rank|islands|reset]"
        current: "<aqua>[name]</aqua><gray> 是 </gray><gold>[rank]</gold><gray> - [number] 座岛屿（实际测绘 [real]，调整 [bonus]）。</gray>"
        unknown-rank: "<red>没有这个等级：[name]。请使用配置中的等级标识、岛屿数量，或 'reset'。</red>"
      reflag:
        description: "为所有贸易岛屿重新应用治安等级旗标"
        done: "<green>已为 [number] 座贸易岛屿重新应用治安旗标。</green>"
      boat:
        description: "查看玩家的船只记录，或从数据库恢复丢失的现役船只"
        parameters: "<player> [restore]"
        header: "<aqua>数据库记录中 [name] 的船只：</aqua>"
        none: "<gray>没有任何船只记录。</gray>"
        active: "<gold>现役</gold><white> [material] </white><gray>（[id]）- 货物 [used]/[slots]，燃料 [fuel]，最后位置 [world] [x],[y],[z] - [avatar]</gray>"
        old: "<red>旧船</red><white> [material] </white><gray>（[id]）- 货物 [used]/[slots]，燃料 [fuel]，最后位置 [world] [x],[y],[z] - [avatar]</gray>"
        avatar-loaded: "<green>正漂在那里（[type]，位于 [x],[y],[z]）</green>"
        avatar-with: "<yellow>在 [name] 的背包里或脚下</yellow>"
        avatar-unloaded: "<yellow>不在任何已加载的区块中 - 最后位置是线索（死亡掉落物在未加载区块中会冻结并保留）</yellow>"
        hull-exists: "<red>未恢复：船体正漂在 [x],[y],[z] - 恢复会造出一个复制品。</red>"
        hull-carried: "<red>未恢复：他们已经携带着它。</red>"
        restored: "<green>已从数据库把 [name] 的 [material] 恢复到其背包，货物记录完好。</green>"
  spawn:
    # 出生港的名字，用于所有向玩家显示港口名的地方
    name: "出生港"
    teleported: "<aqua>你在出生港上岸。你的船就是你的货舱和生计 - 别离它太远。</aqua>"
    resumed: "<aqua>你从上次离开的地方继续航程。</aqua>"
    already-at-sea: "<red>你已经在海上了。海洋不是靠命令穿越的 - 划船，或从岛屿边界跃迁。</red>"
  starter-kit:
    given: "<gold>你的贸易生涯从一艘橡木船开始：3 个货物槽，燃料箱里有煤炭。船就是你的货舱 - 右键点击它打开。低买高卖。</gold>"
  standing:
    upstanding: "<green>正直</green>"
    clean: "<white>清白</white>"
    offender: "<yellow>违法者</yellow>"
    wanted: "<red>通缉犯</red>"
    fugitive: "<dark_red>逃犯</dark_red>"
    changed: "[title]<gray>你的声望</gray>[subtitle][standing]"
  crime:
    hurt-villager: "<red>市场看到了。声望 -[number]。</red>"
    kill-villager: "<red>一名商人死了。声望 -[number]，你的人头有了赏金。</red>"
    kill-police: "<red>你杀了一名巡逻队员。声望 -[number]。</red>"
    kill-innocent: "<dark_red>谋杀。声望 -[number]，你的人头被悬赏。</dark_red>"
    smuggling: "<red>被查获携带违禁品。声望 -[number]。</red>"
    passenger-trade: "<red>消息传开了。声望 -[number]。</red>"
    bounty-paid: "<gold>已领取 [name] 的赏金：[amount]。</gold>"
    fine-none: "<green>你没有什么需要交代的。</green>"
    fine-quote: "<yellow>港务长合计了你的记录：了结需要 [amount]。</yellow>"
    fine-paid: "<green>罚款已付。你的记录干净了 - 你的名声就是另一回事了。</green>"
    fine-cannot-afford: "<red>你付不起罚款（[amount]）。</red>"
    fine-no-market: "<red>罚款要在贸易岛屿缴纳，不是在这里。</red>"
    fine-barred: "<red>“我们不收你这种人的钱。”去个更乱的港口试试。</red>"
  police:
    responding: "<dark_red>[name] 派出巡逻队来抓你了。他们不会追出边界。</dark_red>"
    broken-off: "<gray>巡逻队在边界处折返。</gray>"
    bounty-tag: "<red> [[amount]]</red>"
  customs:
    clean: "<gray>海关登上你的船，翻看货舱，然后挥手放行。</gray>"
    detected: "[title]<dark_red>海关</dark_red>[subtitle]<red>[name] 派出了巡逻队</red>"
    detected-chat: "<dark_red>[name] 的海关检查了你的货舱：[number] 件违禁品。巡逻队已出发 - 逃跑、战斗，或抛弃货物。</dark_red>"
    seized: "<dark_red>你带着违禁品站在市场里。海关直接没收：[number] 件被没收，罚款 [amount]。</dark_red>"
    flagged: "<dark_red>[name] 记得你。这次不用检查 - 巡逻队已经在路上了。</dark_red>"
    jettisoned: "<green>你的货物被抛下船。巡逻队折返 - 什么也没查到。</green>"
    escaped: "<gold>开阔水域。[name] 跟丢了你 - 但它的港务长不会忘记。</gold>"
    called-off: "<gray>[name] 的巡逻队放弃搜索，掉头回家。货物还在你手里。</gray>"
    caught: "<dark_red>被登船了。[number] 件被没收，罚款 [amount]，而且 [name] 记住了你的名字。</dark_red>"
  rank:
    # 航海者等级名称，与配置 ranks.thresholds 中的标识一一对应
    deck-hand: "甲板水手"
    cabin-scout: "舱室侦察员"
    coast-finder: "寻岸者"
    bay-explorer: "海湾探险家"
    island-hopper: "跳岛客"
    reef-runner: "礁石飞驰者"
    wave-master: "驭浪大师"
    chart-maker: "制图师"
    storm-navigator: "风暴领航员"
    archipelago-ace: "群岛王牌"
    tide-captain: "潮汐船长"
    horizon-hunter: "地平线猎人"
    sea-sentinel: "海洋哨兵"
    salty-commodore: "老练准将"
    ocean-overlord: "海洋霸主"
    pirate-pathfinder: "海盗开路者"
    grand-admiral: "大元帅"
    globe-voyager: "环球航行者"
    mythic-mariner: "传奇水手"
    # /tw rank 的输出
    own: "<aqua>你是 </aqua><gold>[rank]</gold><aqua> - 已测绘 [number] 座岛屿。</aqua>"
    next: "<gray>下一级：</gray><yellow>[rank]</yellow><gray> - 还需 [number] 座岛屿。</gray>"
    top-of-ladder: "<gold>你已站在梯子的顶端。大海是你的了。</gold>"
    board-header: "<aqua>航行最远的水手：</aqua>"
    board-entry: "<yellow>[place]. </yellow><white>[name]</white><gray> - [number] 座岛屿（[rank]）</gray>"
  claim:
    success: "[title]<gold>发现陆地！</gold>[subtitle]<aqua>这座小岛是你的了。</aqua><green>你以 [price] 买下了这座小岛。用队伍命令邀请你的船员 - 并守护属于你的东西。</green>"
    not-on-islet: "<red>脚下没有荒野小岛。请站在你想认领的小岛上。</red>"
    already-claimed: "<red>这座小岛已被认领。</red>"
    has-island: "<red>你已经属于一座岛屿。请先放弃或离开它。</red>"
    rank-too-low: "<red>港务长不会把土地交给没有资历的水手：认领需要 </red><gold>[rank]</gold><red> 等级（已测绘 [number] 座岛屿 - 你有 [charted] 座）。</red>"
    no-economy: "<red>没有运行中的经济系统 - 本服务器已禁用认领。</red>"
    cannot-afford: "<red>土地要花钱：[price]，认领时全额支付。</red>"
    waters-taken: "<red>这是港口的水域 - 请认领离贸易航线更远的小岛。</red>"
  home:
    no-island: "<red>你没有岛屿。请先认领一座荒野小岛。</red>"
    not-on-island: "<red>只能在自己的岛上使用。家是在岸上安排的，不是隔着大海下命令。</red>"
    set: "<green>家已设置。你将在此重生，在岛上时 </green><yellow>/tw home</yellow><green> 会把你带到这里。</green>"
    teleported: "<aqua>你到家了。</aqua>"
    bearing: "<aqua>家在 </aqua><gold>[direction]</gold><aqua> 方向，</aqua><white>[number]</white><aqua> 格之外。一帆风顺。</aqua>"
    port-name: "家"
    course-on: "<gray>航向已设定。白天太阳指出方位；夜晚星星还会告诉你距离。再次 </gray><yellow>/tw go</yellow><gray> 收起星空。</gray>"
    course-off: "<gray>你不再仰望星空。</gray>"
    course-arrived: "<green>家乡水域。航向已完成它的使命。</green>"
  unclaim:
    owner-only: "<red>只有岛主能把岛屿还给荒野。</red>"
    not-a-claim: "<red>这座岛屿从来不是认领的小岛 - 你无权放弃它。</red>"
    team-first: "<red>你的船员仍占有这座岛屿。请先踢出所有成员 - 放弃本来就该是痛的。</red>"
    confirm: "<gold>把小岛还给荒野？不退款。建造的一切都会留下，第一个登岛的水手可以全部认领。</gold>"
    done: "<green>小岛重归荒野。你建造的东西还在 - 直到有人认领它。</green>"
  direction:
    north: "北"
    north-east: "东北"
    east: "东"
    south-east: "东南"
    south: "南"
    south-west: "西南"
    west: "西"
    north-west: "西北"
  band:
    safe: "<blue>安全</blue>"
    policed: "<green>有治安</green>"
    frontier: "<yellow>边疆</yellow>"
    lawless: "<red>无法</red>"
    anarchic: "<dark_red><bold>无政府</bold></dark_red>"
  # 港口的经济类型，用于所有说明港口种类的文字
  type:
    agricultural: "农业"
    forest: "林业"
    fishing: "渔业"
    mining: "矿业"
    industrial: "工业"
    luxury: "奢侈品"
    frozen: "冰封"
  # 港口名由这些音节拼成（每个名字 2-4 个：LA+VE 是 "Lave"）。用你的文字写出
  # 每个音节，所有港口名都会随之改变，本语言的每个玩家看到的都一样。留空则
  # 保留该音节原样。星图只能绘制拉丁字母，所以当音节使用其他文字时，星图上
  # 仍显示英文名。
  name-token:
    le: "勒"
    xe: "谢"
    ge: "格"
    za: "扎"
    ce: "塞"
    bi: "比"
    so: "索"
    us: "乌斯"
    es: "埃斯"
    ar: "阿尔"
    ma: "马"
    in: "因"
    di: "迪"
    re: "雷"
    a: "亚"
    er: "尔"
    at: "阿特"
    en: "恩"
    be: "贝"
    ra: "拉"
    la: "莱"
    ve: "维"
    ti: "蒂"
    ed: "埃德"
    or: "奥尔"
    qu: "库"
    an: "安"
    te: "特"
    is: "伊斯"
    ri: "里"
    # "on" 必须加引号：不加引号的 on/off/yes/no 会被当作 YAML 布尔值
    "on": "翁"
  # 货物种类，用于航海日志（/tw prices）。命令参数仍使用英文单词。
  category:
    crops: "农作物"
    food: "食物"
    fish: "鱼类"
    wood: "木材"
    stone: "石材"
    ores: "矿石"
    metals: "金属"
    gems: "宝石"
    luxury: "奢侈品"
    misc: "杂货"
    salvage: "打捞品"
  # 海洋上交易的货物、燃料和船体的名称，每种材料一行（小写枚举名）。留空则由
  # 玩家自己的客户端在对话框、菜单和全息文字中翻译该物品 - 无需翻译。填上则
